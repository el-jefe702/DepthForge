<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · DepthForge</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1120; color:#e2e8f0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; padding:24px; }
    .card { width:min(100%,400px); background:#111827; border:1px solid #1f2937; border-radius:16px; padding:28px; }
    h1 { margin:0 0 6px; font-size:24px; }
    p { margin:0 0 20px; color:#94a3b8; font-size:14px; }
    label { display:block; font-size:13px; margin:12px 0 6px; color:#cbd5e1; }
    input { width:100%; padding:12px; border-radius:10px; border:1px solid #334155; background:#0b1120; color:#e2e8f0; font-size:16px; }
    button { width:100%; margin-top:16px; padding:12px; border:0; border-radius:10px; background:#4f46e5; color:white; font-size:16px; font-weight:600; cursor:pointer; }
    .message { min-height:20px; margin-top:12px; font-size:14px; color:#f87171; }
    .message.ok { color:#4ade80; }
    .toggle { margin-top:16px; font-size:14px; color:#94a3b8; text-align:center; }
    .toggle a { color:#818cf8; }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="title">Welcome back</h1>
    <p id="subtitle">Sign in to continue to DepthForge.</p>

    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>

      <button id="submitBtn" type="submit">Sign in</button>
    </form>

    <div id="message" class="message"></div>

    <div class="toggle">
      <span id="toggleText">Need an account?</span>
      <a href="#" id="toggleLink">Sign up</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://qvesjthnzneimllpujng.supabase.co',
      'sb_publishable_ZB_b365K0Q-JTYpKoYPswQ_Y8JJ6qZ9'
    );

    let mode = 'signin';
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const toggleText = document.getElementById('toggleText');
    const toggleLink = document.getElementById('toggleLink');
    const password = document.getElementById('password');

    function setMode(next) {
      mode = next;
      message.textContent = '';
      message.className = 'message';
      if (mode === 'signin') {
        title.textContent = 'Welcome back';
        subtitle.textContent = 'Sign in to continue to DepthForge.';
        submitBtn.textContent = 'Sign in';
        toggleText.textContent = 'Need an account?';
        toggleLink.textContent = 'Sign up';
        password.autocomplete = 'current-password';
      } else {
        title.textContent = 'Create account';
        subtitle.textContent = 'Create a DepthForge account to continue.';
        submitBtn.textContent = 'Create account';
        toggleText.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign in';
        password.autocomplete = 'new-password';
      }
    }

    toggleLink.addEventListener('click', (event) => {
      event.preventDefault();
      setMode(mode === 'signin' ? 'signup' : 'signin');
    });

    document.getElementById('authForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = password.value;
      submitBtn.disabled = true;
      message.textContent = '';
      message.className = 'message';

      const { error } = mode === 'signin'
        ? await supabase.auth.signInWithPassword({ email, password: pass })
        : await supabase.auth.signUp({ email, password: pass });

      submitBtn.disabled = false;

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (mode === 'signup') {
        message.className = 'message ok';
        message.textContent = 'Account created. If email confirmation is enabled, check your inbox, then sign in.';
        setMode('signin');
        return;
      }

      location.replace('/');
    });

    (async () => {
      const { data } = await supabase.auth.getSession();
      if (data.session) location.replace('/');
    })();
  </script>
</body>
</html>
