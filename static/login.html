<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · SLCreations DepthForge</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #07070b;
      background-image:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(212, 175, 55, 0.08) 0px, transparent 50%);
      color: #f0f0f8;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand {
      color: #f0f0f8;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 21px;
      letter-spacing: 0.5px;
    }
    .brand span { color: #d4af37; }
    .nav-links a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }
    .nav-links a:hover { color: #f8fafc; }
    .center-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 420px);
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #0b1120;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 22px;
      border: 1px solid #1e293b;
    }
    .tab-btn {
      margin: 0;
      padding: 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #4f46e5;
      color: #fff;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 20px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
    label { display: block; font-size: 13px; margin: 14px 0 6px; color: #cbd5e1; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1120;
      color: #e2e8f0;
      font-size: 15px;
    }
    input:focus {
      outline: 2px solid #6366f1;
      border-color: transparent;
    }
    button.primary {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { min-height: 20px; margin-top: 14px; font-size: 14px; color: #f87171; }
    .message.ok { color: #4ade80; }
    .toggle { margin-top: 16px; font-size: 14px; color: #94a3b8; text-align: center; }
    .toggle a { color: #818cf8; text-decoration: none; font-weight: 600; }
    .starter-badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(79, 70, 229, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">SL<span>CREATIONS</span> · DEPTHFORGE</a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/app">Forge Studio</a>
      <a href="/dashboard">Dashboard</a>
    </nav>
  </header>

  <div class="center-wrap">
    <main class="card">
      <div class="tabs">
        <button type="button" id="tabSignin" class="tab-btn active">Sign In</button>
        <button type="button" id="tabSignup" class="tab-btn">Create Account</button>
      </div>

      <span id="starterBadge" class="starter-badge" style="display:none;">Includes 10 free starter credits</span>
      <h1 id="title">Welcome back</h1>
      <p id="subtitle">Sign in to access your DepthForge studio &amp; credit wallet.</p>

      <form id="authForm">
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>

        <button id="submitBtn" class="primary" type="submit">Sign In</button>
      </form>

      <div id="message" class="message"></div>

      <div class="toggle">
        <span id="toggleText">Need an account?</span>
        <a href="#" id="toggleLink">Sign up</a>
      </div>
    </main>
  </div>

  <script src="/static/auth.js"></script>
  <script>
    let mode = (location.pathname === '/signup' || new URLSearchParams(location.search).get('mode') === 'signup')
      ? 'signup'
      : 'signin';

    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');
    const toggleText = document.getElementById('toggleText');
    const toggleLink = document.getElementById('toggleLink');
    const password = document.getElementById('password');
    const tabSignin = document.getElementById('tabSignin');
    const tabSignup = document.getElementById('tabSignup');
    const starterBadge = document.getElementById('starterBadge');

    function setMode(next) {
      mode = next;
      message.textContent = '';
      message.className = 'message';
      if (mode === 'signin') {
        tabSignin.classList.add('active');
        tabSignup.classList.remove('active');
        starterBadge.style.display = 'none';
        title.textContent = 'Welcome back';
        subtitle.textContent = 'Sign in to access your DepthForge studio & credit wallet.';
        submitBtn.textContent = 'Sign In';
        toggleText.textContent = 'Need an account?';
        toggleLink.textContent = 'Sign up';
        password.autocomplete = 'current-password';
      } else {
        tabSignup.classList.add('active');
        tabSignin.classList.remove('active');
        starterBadge.style.display = 'inline-block';
        title.textContent = 'Create your account';
        subtitle.textContent = 'Start generating 16-bit CNC & laser depth maps in seconds.';
        submitBtn.textContent = 'Create Account';
        toggleText.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign in';
        password.autocomplete = 'new-password';
      }
    }

    setMode(mode);

    tabSignin.addEventListener('click', () => setMode('signin'));
    tabSignup.addEventListener('click', () => setMode('signup'));
    toggleLink.addEventListener('click', (event) => {
      event.preventDefault();
      setMode(mode === 'signin' ? 'signup' : 'signin');
    });

    document.getElementById('authForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = password.value;
      submitBtn.disabled = true;
      message.textContent = '';
      message.className = 'message';

      const endpoint = mode === 'signin' ? '/api/auth/login' : '/api/auth/signup';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();
        submitBtn.disabled = false;

        if (!res.ok) {
          message.textContent = data.error || 'Authentication failed.';
          return;
        }

        window.DepthForgeAuth.saveSession(data.token, data.user);
        message.className = 'message ok';
        message.textContent = mode === 'signup' ? 'Account created! Redirecting...' : 'Signed in! Redirecting...';
        const nextUrl = new URLSearchParams(location.search).get('next') || '/dashboard';
        setTimeout(() => location.replace(nextUrl), 350);
      } catch (err) {
        submitBtn.disabled = false;
        message.textContent = err.message || 'Network error.';
      }
    });
  </script>
</body>
</html>
