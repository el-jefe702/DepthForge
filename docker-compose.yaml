services:
  depthforge:
    build: .
    image: depthforge-depthforge:104053b
    ports:
      - "127.0.0.1:8001:8080"
    # .env stays on the host and is read at runtime; it is never copied into the
    # image, so rebuilds cannot destroy it. Requires Docker Compose v2.24+.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      PYTHON_EXEC: "python3"
      SUBSCRIPTIONS_DB_PATH: "/app/data/subscriptions.db"
      JWT_SECRET: "${JWT_SECRET:-depthforge-spatialops-prod-jwt-secret}"
    volumes:
      - depthforge_generated_data:/app/static/generated
      - depthforge_app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  depthforge_generated_data:
    external: true
    name: depthforge_generated_data
  depthforge_app_data:
    external: true
    name: depthforge_app_data
