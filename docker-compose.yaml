services:
  depthforge:
    build: .
    ports:
      - "8000:8080"
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:?Set GEMINI_API_KEY before running docker compose}"
      PORT: "8080"
    volumes:
      - generated_data:/app/static/generated
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8080/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  generated_data:
    driver: local
