name: Resolve PR 4 conflicts
on:
  push:
    branches: [chore/remove-vercel]
    paths: [.github/workflows/resolve-pr4.yml]
permissions:
  contents: write
concurrency:
  group: resolve-pr4
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-vercel
          fetch-depth: 0
      - name: Merge main with guarded resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main chore/remove-vercel
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/chore/remove-vercel)" = "$GITHUB_SHA"
          if ! git merge --no-commit --no-ff origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for file in "${conflicts[@]}"; do
              case "$file" in
                docker-compose.yaml|README.md|LICENSE)
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unexpected conflict: $file; refusing automatic resolution"
                  git merge --abort
                  exit 1
                  ;;
              esac
            done
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = 'The repository does not currently include `.env.example`; `.gitignore` ignores `.env` but does not have broader `.env`-variant rules.'
          new = 'The repository includes `.env.example` as a secret-free template. `.gitignore` ignores `.env` and `.env.*`, while allowing `.env.example`. Create `.env` from the template only if it does not already exist, then set a real, nonempty `GEMINI_API_KEY`. Never overwrite an existing host `.env` or commit real credentials.'
          if old not in text:
              raise SystemExit('Expected README passage missing; stopping for review')
          if not Path('.env.example').is_file():
              raise SystemExit('Expected environment template missing')
          ignore = Path('.gitignore').read_text().splitlines()
          if not {'.env', '.env.*', '!.env.example'}.issubset(ignore):
              raise SystemExit('Expected secret ignore rules missing')
          license_text = Path('LICENSE').read_text()
          if 'SpatialOps, LLC. All rights reserved.' not in license_text or 'MIT License' in license_text:
              raise SystemExit('Proprietary license guard failed')
          p.write_text(text.replace(old, new, 1))
          PY
          test -z "$(git diff --name-only --diff-filter=U)"
          git add README.md
          git diff --cached --check
          GEMINI_API_KEY=ci-placeholder-not-a-real-api-key docker compose config --quiet
          git commit -m "Merge main into PR 4 and reconcile deployment documentation"
          git push origin HEAD:chore/remove-vercel
