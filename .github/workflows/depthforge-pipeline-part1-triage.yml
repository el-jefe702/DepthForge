name: "DepthForge Pipeline - Part 1: Triage"
"on":
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to triage
        required: true
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: depthforge-part1-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install google-genai
      - name: Analyze and save checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}
          FALLBACK_API_KEY1: ${{ secrets.FALLBACK_API_KEY1 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
        run: python scripts/depthforge_triage.py
      - name: Save checkpoint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-issue-${{ inputs.issue_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/depthforge-triage
          if-no-files-found: warn
          retention-days: 30
      - name: Post plan and stop
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/depthforge-triage/plan.md"
          gh label create triaged --color 0e8a16 --description "Triage plan saved; awaiting review" --force
          gh issue edit "$ISSUE_NUMBER" --add-label triaged
