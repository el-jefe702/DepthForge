name: PR 7 test validation
on:
  push:
    branches: [pr4-finished]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.ref == 'refs/heads/pr4-finished' || github.head_ref == 'pr4-finished'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless 'rembg[cpu]'
          python -c "import cv2, numpy, rembg; print('Python dependencies available')"
          echo "PYTHON_EXEC=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install Node dependencies
        run: npm ci
      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-tests.log
      - name: Failure excerpts
        if: always()
        shell: bash
        run: |
          if [ -f node-tests.log ]; then
            grep -Ein -B 5 -A 20 'not ok|AssertionError|ModuleNotFoundError|TypeError|ReferenceError|SyntaxError' node-tests.log > test-errors.txt || true
            cat test-errors.txt
            tail -n 30 node-tests.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-test-logs-${{ github.run_id }}
          path: |
            node-tests.log
            test-errors.txt
          if-no-files-found: warn
          retention-days: 7
