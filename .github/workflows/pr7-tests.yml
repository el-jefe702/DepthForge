name: PR 7 test validation
on:
  push:
    branches: [pr4-finished]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.ref == 'refs/heads/pr4-finished' || github.head_ref == 'pr4-finished'
    name: tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pr7
            ref: refs/heads/pr4-finished
          - target: main-baseline
            ref: 53cbd4f36662e5b98bc4dcac7ff66bc24d20df93
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Record tested commit
        run: git rev-parse HEAD | tee tested-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless 'rembg[cpu]'
          python -c "import cv2, numpy, rembg; print('Python dependencies available')"
          python -m pip freeze > python-packages.txt
          echo "PYTHON_EXEC=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install Node dependencies
        run: npm ci
      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-tests.log
      - name: Failure excerpts and summary
        if: always()
        shell: bash
        run: |
          echo '## Test results' >> "$GITHUB_STEP_SUMMARY"
          cat tested-commit.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -f node-tests.log ]; then
            grep -Ein -B 5 -A 30 'not ok|AssertionError|ModuleNotFoundError|TypeError|ReferenceError|SyntaxError' node-tests.log > test-errors.txt || true
            cat test-errors.txt
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 node-tests.log >> "$GITHUB_STEP_SUMMARY"
            cat test-errors.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-test-logs-${{ matrix.target }}-${{ github.run_id }}
          path: |
            node-tests.log
            test-errors.txt
            tested-commit.txt
            python-packages.txt
          if-no-files-found: warn
          retention-days: 7
