name: Autonomous Self-Evolving AI Issue Resolver & PR Reviewer

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Specific Issue Number to resolve (leave blank to auto-pick next open issue)"
        required: false
        type: string
      pr_number:
        description: "Specific PR Number to audit/review/close (optional)"
        required: false
        type: string

concurrency:
  group: ai-issue-resolver-singleton
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

env:
  TRUST_PROXY: "1"
  NODE_ENV: "test"
  GEMINI_MODEL: "gemini-3.1-pro-preview"
  MAX_HEAL_ATTEMPTS: "3"
  LEDGER_PATH: ".ai-memory/evolution_ledger.json"

jobs:
  resolve-review-evolve:
    name: Resolve, Review PR, Assess Win & Evolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >
      github.actor != 'github-actions[bot]' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Self-Clean Any Duplicate ai-issue Workflow Files
        run: |
          set +e
          for f in .github/workflows/ai-issue*.yml ai-issue*.yml; do
            if [ -f "$f" ] && [ "$f" != ".github/workflows/ai-issue-resolver.yml" ]; then
              echo "Removing duplicate workflow file: $f"
              git rm -f "$f" 2>/dev/null \vert{}\vert{} rm -f "$f"
            fi
          done
          git config --global user.name "SpatialOps Autonomous Architect"
          git config --global user.email "actions@spatialops.llc"
          git commit -m "chore(ci): cleanup duplicate workflow files [skip ci]" 2>/dev/null || true
          git push origin HEAD:main 2>/dev/null || true
          set -e

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System, Node & Python Dependencies (OpenCV Fix)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq libgl1 libglib2.0-0 python3-opencv python3-numpy
          npm ci || npm install
          pip install --upgrade pip
          pip install opencv-python-headless numpy trimesh google-genai requests --break-system-packages
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --break-system-packages
          fi

      - name: Configure Git Identity
        run: |
          git config --global user.name "SpatialOps Autonomous Architect"
          git config --global user.email "actions@spatialops.llc"

      - name: Initialize Self-Evolving Memory Ledger
        run: |
          mkdir -p .ai-memory
          if [ ! -f "$LEDGER_PATH" ]; then
            cat << 'EOF' > "$LEDGER_PATH"
          {
            "schema_version": "2.0.0",
            "total_runs": 0,
            "wins": 0,
            "self_healed_recoveries": 0,
            "invariants": [
              "Always maintain TRUST_PROXY=1 for Express rate-limiters behind Caddy/VPS reverse proxies.",
              "Always preserve strict 16-bit uint16 (0-65535) PNG output in processor.py after float32 Gaussian/bilateral smoothing.",
              "Always install python3-opencv and opencv-python-headless to prevent ModuleNotFoundError: No module named 'cv2' during tests.",
              "Use gemini-3.1-pro-preview for all generative API tasks."
            ],
            "learned_heuristics": [],
            "history": []
          }
          EOF
          fi

      - name: Select Target Issue or PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ github.event.inputs.issue_number }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          TARGET_ISSUE=""
          TARGET_PR=""

          if [ -n "$INPUT_PR" ]; then
            TARGET_PR="$INPUT_PR"
          elif [ "$EVENT_NAME" = "pull_request_target" ] && [ -n "$EVENT_PR" ]; then
            TARGET_PR="$EVENT_PR"
          fi

          if [ -n "$INPUT_ISSUE" ]; then
            TARGET_ISSUE="$INPUT_ISSUE"
          elif [ "$EVENT_NAME" = "issues" ] && [ -n "$EVENT_ISSUE" ]; then
            TARGET_ISSUE="$EVENT_ISSUE"
          elif [ -z "$TARGET_PR" ]; then
            TARGET_ISSUE=$(gh issue list --state open --limit 30 --json number,labels \
              --jq '[.[] | select(([.labels[].name] | inside(["needs-human-review", "wontfix", "in-progress"]) | not))] | sort_by(.number) | .[0].number // empty')
          fi

          echo "issue_number=$TARGET_ISSUE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$TARGET_PR" >> "$GITHUB_OUTPUT"
          echo "Selected Target -> Issue: '${TARGET_ISSUE:-none}', PR: '${TARGET_PR:-none}'"

      - name: Execute Self-Evolving AI Solver & Adversarial PR Reviewer
        if: steps.target.outputs.issue_number != '' || steps.target.outputs.pr_number != ''
        id: agent
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          cat << 'PYEOF' > /tmp/autonomous_evolver.py
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          from google import genai
          from google.genai import types

          REPO = os.environ.get("REPO", "")
          ISSUE_NUMBER = os.environ.get("ISSUE_NUMBER", "").strip()
          PR_NUMBER = os.environ.get("PR_NUMBER", "").strip()
          GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          MODEL_NAME = os.environ.get("GEMINI_MODEL", "gemini-3.1-pro-preview")
          MAX_ATTEMPTS = int(os.environ.get("MAX_HEAL_ATTEMPTS", "3"))
          LEDGER_PATH = Path(os.environ.get("LEDGER_PATH", ".ai-memory/evolution_ledger.json"))

          if not GEMINI_API_KEY:
              print("::error::GEMINI_API_KEY secret is required for autonomous resolution.")
              sys.exit(1)

          client = genai.Client(api_key=GEMINI_API_KEY)

          def sh(cmd, check=False, capture=True):
              print(f"$ {cmd}")
              res = subprocess.run(
                  cmd,
                  shell=True,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.STDOUT if capture else None,
              )
              if check and res.returncode != 0:
                  raise RuntimeError(f"Command failed ({res.returncode}): {cmd}\n{res.stdout}")
              return res.returncode, (res.stdout or "").strip()

          def load_ledger():
              if LEDGER_PATH.exists():
                  try:
                      return json.loads(LEDGER_PATH.read_text(encoding="utf-8"))
                  except Exception:
                      pass
              return {
                  "schema_version": "2.0.0",
                  "total_runs": 0,
                  "wins": 0,
                  "self_healed_recoveries": 0,
                  "invariants": [],
                  "learned_heuristics": [],
                  "history": []
              }

          def save_ledger(ledger):
              LEDGER_PATH.parent.mkdir(parents=True, exist_ok=True)
              ledger["history"] = ledger.get("history", [])[-40:]
              ledger["learned_heuristics"] = list(dict.fromkeys(ledger.get("learned_heuristics", [])))[-25:]
              LEDGER_PATH.write_text(json.dumps(ledger, indent=2) + "\n", encoding="utf-8")

          def get_repo_snapshot():
              _, tree = sh("git ls-files | grep -vE '^(node_modules|dist|build|\\.git)/' | head -n 160")
              key_files = ["package.json", "server.js", "processor.py", "README.md", ".env.example", "requirements.txt"]
              snippets = {}
              for f in key_files:
                  p = Path(f)
                  if p.exists() and p.is_file():
                      content = p.read_text(encoding="utf-8", errors="ignore")
                      snippets[f] = content[:12000]
              return tree, snippets

          def run_validation_suite():
              logs = []
              # NEW: Force python dependencies directly before running the test suite
              sh("python3 -m pip install opencv-python-headless numpy trimesh requests --break-system-packages || true")
              if Path("requirements.txt").exists():
                  sh("python3 -m pip install -r requirements.txt --break-system-packages || true")

              pkg = Path("package.json")
              if pkg.exists():
                  # Ensure node dependencies are installed
                  rc, out = sh("npm install --no-audit --no-fund")
                  logs.append(f"=== npm install (exit {rc}) ===\n{out}")
                  if rc != 0:
                      return False, "\n".join(logs)

                  pkg_data = json.loads(pkg.read_text(encoding="utf-8"))
                  scripts = pkg_data.get("scripts", {})
                  if "sync:android" in scripts:
                      rc, out = sh("npm run sync:android")
                      logs.append(f"=== npm run sync:android (exit {rc}) ===\n{out}")
                      if rc != 0:
                          return False, "\n".join(logs)
                  if "test" in scripts:
                      rc, out = sh("TRUST_PROXY=1 npm test")
                      logs.append(f"=== TRUST_PROXY=1 npm test (exit {rc}) ===\n{out}")
                      if rc != 0:
                          return False, "\n".join(logs)
              if Path("processor.py").exists():
                  rc, out = sh("python3 -m py_compile processor.py")
                  logs.append(f"=== py_compile processor.py (exit {rc}) ===\n{out}")
                  if rc != 0:
                      return False, "\n".join(logs)
              return True, "\n".join(logs) if logs else "All validation checks passed."

          def call_gemini_json(system_instruction, prompt):
              response = client.models.generate_content(
                  model=MODEL_NAME,
                  contents=prompt,
                  config=types.GenerateContentConfig(
                      system_instruction=system_instruction,
                      response_mime_type="application/json",
                      temperature=0.15,
                  ),
              )
              return json.loads(response.text)

          ledger = load_ledger()
          ledger["total_runs"] = ledger.get("total_runs", 0) + 1

          for lbl in ["in-progress", "ai-resolved", "needs-human-review", "ai-reviewed"]:
              sh(f"gh label create '{lbl}' --repo '{REPO}' --force || true")

          issue_data = {}
          if ISSUE_NUMBER:
              rc, out = sh(f"gh issue view {ISSUE_NUMBER} --repo '{REPO}' --json number,title,body,labels,state")
              if rc == 0 and out:
                  issue_data = json.loads(out)

          if ISSUE_NUMBER and not PR_NUMBER:
              _, existing_pr = sh(
                  f"gh pr list --repo '{REPO}' --state open --json number,headRefName,title "
                  f"--jq '[.[] | select(.headRefName == \"fix/issue-{ISSUE_NUMBER}\" or (.title | contains(\"#{ISSUE_NUMBER}\")))] | .[0].number // empty'"
              )
              if existing_pr:
                  PR_NUMBER = existing_pr.strip()
                  print(f"Found existing open PR #{PR_NUMBER} for Issue #{ISSUE_NUMBER}")

          branch_name = f"fix/issue-{ISSUE_NUMBER}" if ISSUE_NUMBER else f"audit/pr-{PR_NUMBER}"

          if PR_NUMBER and not ISSUE_NUMBER:
              sh(f"gh pr checkout {PR_NUMBER} --repo '{REPO}'", check=True)
              _, pr_meta_raw = sh(f"gh pr view {PR_NUMBER} --repo '{REPO}' --json number,title,body,headRefName")
              pr_meta = json.loads(pr_meta_raw)
              branch_name = pr_meta["headRefName"]
              issue_data = {"number": PR_NUMBER, "title": pr_meta["title"], "body": pr_meta["body"]}
          else:
              sh(f"git checkout -B '{branch_name}' origin/main", check=True)

          if ISSUE_NUMBER:
              sh(f"gh issue edit {ISSUE_NUMBER} --repo '{REPO}' --add-label 'in-progress' || true")

          tree, snippets = get_repo_snapshot()

          issue_body = issue_data.get("body") or ""
          issue_title = issue_data.get("title") or ""
          for line in tree.splitlines():
              fname = line.strip()
              if fname and fname in issue_body and fname not in snippets and Path(fname).exists():
                  snippets[fname] = Path(fname).read_text(encoding="utf-8", errors="ignore")[:15000]

          solver_system = f"""You are the SpatialOps Autonomous Self-Evolving Code Architect for DepthForge.
          You resolve GitHub issues accurately, adhere strictly to repository invariants, and output valid JSON only.

          EVOLUTION LEDGER INVARIANTS:
          {json.dumps(ledger.get("invariants", []), indent=2)}

          LEARNED HEURISTICS FROM PAST RUNS:
          {json.dumps(ledger.get("learned_heuristics", []), indent=2)}

          Return a JSON object matching this exact schema:
          {{
            "already_resolved": boolean,
            "resolution_rationale": "Detailed explanation of the root cause and fix (or why it is already resolved)",
            "files_to_write": [
              {{
                "path": "relative/path/to/file",
                "content": "COMPLETE, UNTRUNCATED file content"
              }}
            ],
            "files_to_delete": ["relative/path/to/obsolete_file"],
            "new_heuristic_learned": "A concise 1-sentence technical takeaway to store in the evolution ledger for future runs"
          }}
          """

          last_test_log = ""
          test_passed = False
          already_resolved = False
          solver_output = {}
          used_retries = 0

          for attempt in range(1, MAX_ATTEMPTS + 1):
              print(f"=== Solver Attempt {attempt}/{MAX_ATTEMPTS} ===")
              user_prompt = f"""
              TARGET ISSUE #{issue_data.get('number')}: {issue_title}
              ISSUE DESCRIPTION:
              {issue_body}

              REPOSITORY FILE TREE:
              {tree}

              CURRENT FILE CONTENTS:
              {json.dumps(snippets, indent=2)}

              PREVIOUS ATTEMPT TEST FAILURE LOGS (if any):
              {last_test_log if last_test_log else "None (First Attempt)"}
              """

              solver_output = call_gemini_json(solver_system, user_prompt)
              already_resolved = bool(solver_output.get("already_resolved", False))

              for del_path in solver_output.get("files_to_delete", []):
                  p = Path(del_path)
                  if p.exists() and p.is_file():
                      p.unlink()

              for file_obj in solver_output.get("files_to_write", []):
                  p = Path(file_obj["path"])
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(file_obj["content"], encoding="utf-8")
                  snippets[file_obj["path"]] = file_obj["content"][:15000]

              test_passed, last_test_log = run_validation_suite()
              if test_passed:
                  if attempt > 1:
                      ledger["self_healed_recoveries"] = ledger.get("self_healed_recoveries", 0) + 1
                  used_retries = attempt - 1
                  break
              else:
                  print(f"Validation failed on attempt {attempt}. Self-healing...")

          _, git_status = sh("git status --porcelain")
          has_code_changes = bool(git_status.strip())

          if has_code_changes and test_passed:
              sh("git add -A", check=True)
              commit_msg = f"fix: resolve #{ISSUE_NUMBER or PR_NUMBER} - {issue_title[:60]}"
              sh(f"git commit -m \"{commit_msg}\"", check=True)
              sh(f"git push -u origin '{branch_name}' --force", check=True)

              if not PR_NUMBER:
                  pr_body = (
                      f"## Autonomous Resolution for #{ISSUE_NUMBER}\n\n"
                      f"Closes #{ISSUE_NUMBER}\n\n"
                      f"### Root Cause & Changes\n{solver_output.get('resolution_rationale', '')}\n\n"
                      f"### Self-Healing Telemetry\n"
                      f"- **Validation Suite (`F1–F20`):** PASSED\n"
                      f"- **Self-Heal Retries Used:** `{used_retries}`\n"
                  )
                  Path("/tmp/pr_body.md").write_text(pr_body, encoding="utf-8")
                  rc, pr_url = sh(
                      f"gh pr create --repo '{REPO}' --base main --head '{branch_name}' "
                      f"--title \"fix(#{ISSUE_NUMBER}): {issue_title[:65]}\" --body-file /tmp/pr_body.md"
                  )
                  _, PR_NUMBER = sh(f"gh pr view '{branch_name}' --repo '{REPO}' --json number --jq '.number'")
                  PR_NUMBER = PR_NUMBER.strip()

          _, git_diff = sh("git diff origin/main...HEAD")
          reviewer_system = """You are the Principal Adversarial PR Reviewer & Win Assessor for SpatialOps, LLC.
          Evaluate the proposed git diff (or already-resolved state), test suite output, and original issue requirements.
          Output strict JSON matching this schema:
          {
            "verdict": "WIN_MERGE" | "ALREADY_RESOLVED_CLOSE" | "NEEDS_HUMAN",
            "confidence_score": number (0 to 100),
            "criteria_checklist": [
              {"criterion": "string", "met": boolean, "evidence": "string"}
            ],
            "review_summary_markdown": "Comprehensive PR review markdown table and technical critique",
            "closeout_notes_markdown": "Executive closeout summary detailing what won, how F1-F20 validated, and production impact",
            "prompt_evolution_rule": "A concrete rule to add to the agent's learned_heuristics to make future runs faster or safer"
          }
          """

          reviewer_prompt = f"""
          ISSUE #{ISSUE_NUMBER}: {issue_title}
          ISSUE BODY:
          {issue_body}

          SOLVER RATIONALE:
          {solver_output.get("resolution_rationale", "")}
          SOLVER CLAIMED ALREADY RESOLVED: {already_resolved}
          HAS CODE CHANGES: {has_code_changes}
          TEST SUITE PASSED: {test_passed}
          TEST SUITE LOGS:
          {last_test_log[-6000:]}

          GIT DIFF AGAINST origin/main:
          {git_diff[:18000] if git_diff else "(No diff - clean working tree)"}
          """

          review_result = call_gemini_json(reviewer_system, reviewer_prompt)
          verdict = review_result.get("verdict", "NEEDS_HUMAN")
          confidence = review_result.get("confidence_score", 0)

          if not test_passed:
              verdict = "NEEDS_HUMAN"
          elif not has_code_changes and already_resolved and test_passed:
              verdict = "ALREADY_RESOLVED_CLOSE"

          for h in [solver_output.get("new_heuristic_learned"), review_result.get("prompt_evolution_rule")]:
              if h and isinstance(h, str) and len(h.strip()) > 10:
                  ledger.setdefault("learned_heuristics", []).append(h.strip())

          if ves)
              if Path("processor.py").exists():
                  rc, out = sh("python3 -m py_compile processor.py")
                  logs.append(f"=== py_compile processor.py (exit {rc}) ===\n{out}")
                  if rc != 0:
