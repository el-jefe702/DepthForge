          has_code_changes = bool(git_status.strip())

          if has_code_changes and test_passed:
              sh("git add -A", check=True)
              commit_msg = f"fix: resolve #{ISSUE_NUMBER or PR_NUMBER} - {issue_title[:60]}"
              sh(f"git commit -m \"{commit_msg}\"", check=True)
              sh(f"git push -u origin '{branch_name}' --force", check=True)

              if not PR_NUMBER:
                  pr_body = (
                      f"## Autonomous Resolution for #{ISSUE_NUMBER}\n\n"
                      f"Closes #{ISSUE_NUMBER}\n\n"
                      f"### Root Cause & Changes\n{solver_output.get('resolution_rationale', '')}\n\n"
                      f"### Self-Healing Telemetry\n"
                      f"- **Validation Suite (`F1–F20`):** PASSED\n"
                      f"- **Self-Heal Retries Used:** `{used_retries}`\n"
                  )
                  Path("/tmp/pr_body.md").write_text(pr_body, encoding="utf-8")
                  rc, pr_url = sh(
                      f"gh pr create --repo '{REPO}' --base main --head '{branch_name}' "
                      f"--title \"fix(#{ISSUE_NUMBER}): {issue_title[:65]}\" --body-file /tmp/pr_body.md"
                  )
                  _, PR_NUMBER = sh(f"gh pr view '{branch_name}' --repo '{REPO}' --json number --jq '.number'")
                  PR_NUMBER = PR_NUMBER.strip()

          _, git_diff = sh("git diff origin/main...HEAD")
          reviewer_system = """You are the Principal Adversarial PR Reviewer & Win Assessor for SpatialOps, LLC.
          Evaluate the proposed git diff (or already-resolved state), test suite output, and original issue requirements.
          Output strict JSON matching this schema:
          {
            "verdict": "WIN_MERGE" | "ALREADY_RESOLVED_CLOSE" | "NEEDS_HUMAN",
            "confidence_score": number (0 to 100),
            "criteria_checklist": [
              {"criterion": "string", "met": boolean, "evidence": "string"}
            ],
            "review_summary_markdown": "Comprehensive PR review markdown table and technical critique",
            "closeout_notes_markdown": "Executive closeout summary detailing what won, how F1-F20 validated, and production impact",
            "prompt_evolution_rule": "A concrete rule to add to the agent's learned_heuristics to make future runs faster or safer"
          }
          """

          reviewer_prompt = f"""
          ISSUE #{ISSUE_NUMBER}: {issue_title}
          ISSUE BODY:
          {issue_body}

          SOLVER RATIONALE:
          {solver_output.get("resolution_rationale", "")}
          SOLVER CLAIMED ALREADY RESOLVED: {already_resolved}
          HAS CODE CHANGES: {has_code_changes}
          TEST SUITE PASSED: {test_passed}
          TEST SUITE LOGS:
          {last_test_log[-6000:]}

          GIT DIFF AGAINST origin/main:
          {git_diff[:18000] if git_diff else "(No diff - clean working tree)"}
          """

          review_result = call_gemini_json(reviewer_system, reviewer_prompt)
          verdict = review_result.get("verdict", "NEEDS_HUMAN")
          confidence = review_result.get("confidence_score", 0)

          if not test_passed:
              verdict = "NEEDS_HUMAN"
          elif not has_code_changes and already_resolved and test_passed:
              verdict = "ALREADY_RESOLVED_CLOSE"

          for h in [solver_output.get("new_heuristic_learned"), review_result.get("prompt_evolution_rule")]:
              if h and isinstance(h, str) and len(h.strip()) > 10:
                  ledger.setdefault("learned_heuristics", []).append(h.strip())

          if verdict in ("WIN_MERGE", "ALREADY_RESOLVED_CLOSE"):
              ledger["wins"] = ledger.get("wins", 0) + 1

          ledger.setdefault("history", []).append({
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "issue": ISSUE_NUMBER,
              "pr": PR_NUMBER,
              "verdict": verdict,
              "confidence": confidence,
              "retries": used_retries,
          })

          checklist_rows = "\n".join([
              f"| {c.get('criterion')} | {'✅ PASS' if c.get('met') else '❌ FAIL'} | {c.get('evidence')} |"
              for c in review_result.get("criteria_checklist", [])
          ])
          full_review_md = (
              f"## 🤖 Autonomous Adversarial PR Review & Win Assessment\n\n"
              f"- **Verdict:** `{verdict}`\n"
              f"- **Win Confidence Score:** `{confidence}%`\n"
              f"- **F1–F20 Test Suite:** `{'PASSED' if test_passed else 'FAILED'}`\n"
              f"- **Self-Heal Retries:** `{used_retries}`\n\n"
              f"### Acceptance Criteria Audit\n"
              f"| Criterion | Status | Evidence |\n"
              f"| :--- | :--- | :--- |\n"
              f"{checklist_rows or '| Core Validation | ✅ PASS | Verified via F1–F20 suite |'}\n\n"
              f"### Reviewer Assessment\n"
              f"{review_result.get('review_summary_markdown', '')}\n\n"
              f"### Closeout Notes\n"
              f"{review_result.get('closeout_notes_markdown', '')}\n\n"
              f"### Failure Telemetry (if failed)\n"
              f"```\n{last_test_log[-3000:]}\n```\n"
          )
          Path("/tmp/review_notes.md").write_text(full_review_md, encoding="utf-8")

          if PR_NUMBER:
              sh(f"gh pr review {PR_NUMBER} --repo '{REPO}' --comment --body-file /tmp/review_notes.md || true")
              sh(f"gh pr edit {PR_NUMBER} --repo '{REPO}' --add-label 'ai-reviewed' || true")

              if verdict == "WIN_MERGE" and has_code_changes and test_passed:
                  print(f"=== WIN ASSESSED ({confidence}%): Squash-Merging PR #{PR_NUMBER} ===")
                  sh(f"gh pr review {PR_NUMBER} --repo '{REPO}' --approve --body '✅ Autonomous Win Assessment Verified. Approving for squash-merge.' || true")
                  rc, merge_out = sh(f"gh pr merge {PR_NUMBER} --repo '{REPO}' --squash --delete-branch")
                  if rc != 0:
                      print(f"Merge fallback triggered: {merge_out}")
                      sh(f"gh pr merge {PR_NUMBER} --repo '{REPO}' --squash --delete-branch --admin || true")
                  sh(f"gh pr comment {PR_NUMBER} --repo '{REPO}' --body '🏁 **PR Closed & Merged via Autonomous Win Assessment.** All F1–F20 validations passed and closeout notes have been logged.' || true")

              elif verdict == "ALREADY_RESOLVED_CLOSE":
                  print(f"=== ALREADY RESOLVED: Closing PR #{PR_NUMBER} with Closeout Notes ===")
                  sh(f"gh pr close {PR_NUMBER} --repo '{REPO}' --delete-branch --comment '🏁 **Closing PR (Already Resolved on `main`).** See closeout review notes above.' || true")

              else:
                  print(f"=== NEEDS HUMAN REVIEW: Flagging PR #{PR_NUMBER} ===")
                  sh(f"gh pr edit {PR_NUMBER} --repo '{REPO}' --add-label 'needs-human-review' || true")

          if ISSUE_NUMBER:
              sh(f"gh issue comment {ISSUE_NUMBER} --repo '{REPO}' --body-file /tmp/review_notes.md || true")
              sh(f"gh issue edit {ISSUE_NUMBER} --repo '{REPO}' --remove-label 'in-progress' || true")

              if verdict in ("WIN_MERGE", "ALREADY_RESOLVED_CLOSE"):
                  sh(f"gh issue edit {ISSUE_NUMBER} --repo '{REPO}' --add-label 'ai-resolved' || true")
                  sh(f"gh issue close {ISSUE_NUMBER} --repo '{REPO}' --reason completed || true")
              else:
                  # HALT & CONTAIN: Apply needs-human-review and clean working tree
                  sh(f"gh issue edit {ISSUE_NUMBER} --repo '{REPO}' --add-label 'needs-human-review' || true")

          # Clean up git worktree so failed jobs leave a pristine state
          sh("git checkout main && git reset --hard origin/main || true")
          save_ledger(ledger)
          sh(f"git add '{LEDGER_PATH}'")
          _, ledger_diff = sh("git status --porcelain")
          if ledger_diff.strip():
              sh("git commit -m 'chore(ai-memory): update ledger telemetry [skip ci]' || true")
              sh("git push origin main || true")

          print(f"🛑 Autonomous cycle stopped safely with verdict: {verdict}")
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as out_f:
              out_f.write(f"verdict={verdict}\n")
          PYEOF
          python3 /tmp/autonomous_evolver.py

      - name: Advance Queue (Strictly Blocked on Failure / Needs Human Review)
        if: always() && steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          NEXT_ISSUE=$(gh issue list --repo "$REPO" --state open --limit 30 --json number,labels \
            --jq '[.[] | select(([.labels[].name] | inside(["needs-human-review", "wontfix", "in-progress"]) | not))] | sort_by(.number) | .[0].number // empty')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "🚀 Advancing autonomous queue to next open Issue #$NEXT_ISSUE..."
            gh workflow run ai-issue-resolver.yml --repo "$REPO" -f issue_number="$NEXT_ISSUE" || true
          else
            echo "🎉 Queue clear! No remaining open actionable issues."
          fi
