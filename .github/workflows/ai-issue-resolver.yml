              branch_name = pr_meta["headRefName"]
              issue_data = {"number": PR_NUMBER, "title": pr_meta["title"], "body": pr_meta["body"]}
          else:
              sh(f"git checkout -B '{branch_name}' origin/main", check=True)

          if ISSUE_NUMBER:
              sh(f"gh issue edit {ISSUE_NUMBER} --repo '{REPO}' --add-label 'in-progress' || true")

          tree, snippets = get_repo_snapshot()

          issue_body = issue_data.get("body") or ""
          issue_title = issue_data.get("title") or ""
          for line in tree.splitlines():
              fname = line.strip()
              if fname and fname in issue_body and fname not in snippets and Path(fname).exists():
                  snippets[fname] = Path(fname).read_text(encoding="utf-8", errors="ignore")[:15000]

