name: Publish readable PR 7 failure evidence
on:
  push:
    branches: [pr4-finished]
    paths: [.github/workflows/pr7-readable-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53cbd4f36662e5b98bc4dcac7ff66bc24d20df93
      - name: Fetch and extract comparison errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/pr7
          gh api "repos/${TARGET_REPO}/actions/runs/38306543321/jobs?filter=latest&per_page=100" > diagnostics/pr7/jobs.json
          for target in pr7 main-baseline; do
            job_id=$(jq -r --arg name "tests (${target})" '[.jobs[] | select(.name == $name)][0].id // empty' diagnostics/pr7/jobs.json)
            test -n "$job_id"
            gh run view --repo "$TARGET_REPO" --job "$job_id" --log > "/tmp/${target}.log"
            test -s "/tmp/${target}.log"
            grep -Ein -B 8 -A 45 'not ok|AssertionError|ModuleNotFoundError|TypeError|ReferenceError|SyntaxError|npm error|npm ERR!' "/tmp/${target}.log" > "diagnostics/pr7/${target}-errors.txt" || true
            test -s "diagnostics/pr7/${target}-errors.txt"
          done
      - name: Publish evidence on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c pr7-failure-evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/pr7/jobs.json diagnostics/pr7/pr7-errors.txt diagnostics/pr7/main-baseline-errors.txt
          git commit -m 'diagnostics: retain raw failures from comparison run 38306543321'
          git push origin HEAD:refs/heads/pr7-failure-evidence
