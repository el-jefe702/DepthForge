name: Restore README and validate PR 7
on:
  push:
    branches: [pr4-finished]
    paths: [.github/workflows/pr7-final-validation.yml]
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ci-placeholder-not-a-real-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr4-finished
          fetch-depth: 0
      - name: Restore documentation and retain VPS note
        run: |
          set -euo pipefail
          git show 53cbd4f36662e5b98bc4dcac7ff66bc24d20df93:README.md > README.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          anchor = '## Overview'
          assert text.count(anchor) == 1
          p.write_text(text.replace(anchor, 'This repository is deployed on a VPS; Vercel config has been removed.\n\n' + anchor, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: restore README content and retain VPS deployment note'
          git push origin HEAD:refs/heads/pr4-finished
      - name: Capture original repair result
        run: |
          mkdir -p diagnostics/pr7
          gh api repos/${{ github.repository }}/actions/runs/38318276640 > diagnostics/pr7/repair-run.json
          gh api 'repos/${{ github.repository }}/actions/runs/38318276640/jobs?filter=latest&per_page=100' > diagnostics/pr7/repair-jobs.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install numpy opencv-python-headless 'rembg[cpu]'
          echo "PYTHON_EXEC=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          npm ci
      - name: Test repaired commit
        run: |
          set -o pipefail
          git rev-parse HEAD > diagnostics/pr7/tested-commit.txt
          set +e
          npm test 2>&1 | tee diagnostics/pr7/node-tests.log
          code=${PIPESTATUS[0]}
          echo "$code" > diagnostics/pr7/test-exit-code.txt
          exit "$code"
      - name: Publish readable results
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnostics/pr7
          if [ -f diagnostics/pr7/node-tests.log ]; then
            tail -n 35 diagnostics/pr7/node-tests.log > diagnostics/pr7/summary.txt
            grep -Ein -B 8 -A 35 'not ok|AssertionError|SyntaxError|ModuleNotFoundError' diagnostics/pr7/node-tests.log > diagnostics/pr7/errors.txt || true
          else
            echo 'Tests did not execute; inspect setup steps.' > diagnostics/pr7/summary.txt
          fi
          cat diagnostics/pr7/summary.txt >> "$GITHUB_STEP_SUMMARY"
          git switch -c pr7-repaired-validation-${{ github.run_id }}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/pr7
          git commit -m 'diagnostics: record repaired PR 7 test results'
          git push origin HEAD:refs/heads/pr7-repaired-validation-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-final-validation-${{ github.run_id }}
          path: diagnostics/pr7/
          retention-days: 7
