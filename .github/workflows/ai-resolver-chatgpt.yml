name: AI resolver — ChatGPT final fallback

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: depthforge-ai-resolver
  cancel-in-progress: false

env:
  OPENAI_MODEL: gpt-4o

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Load issue
        id: select
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json title,body > issue.json
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title issue.json)" >> "$GITHUB_OUTPUT"
          jq -r .body issue.json > issue-body.md

      - name: Build compact context
        env:
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
          ISSUE_TITLE: ${{ steps.select.outputs.title }}
        run: |
          mkdir -p .ai
          {
            echo "Issue #$ISSUE_NUMBER: $ISSUE_TITLE"
            cat issue-body.md
            echo '## Files'
            find . -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './.venv/*' | sort | head -200
            for file in package.json server.js processor.py; do
              [ -f "$file" ] && { echo "## $file"; sed -n '1,500p' "$file"; }
            done
          } > .ai/context.md

      - name: Resolve with ChatGPT
        env:
          OPENAI_API_KEY: ${{ secrets.FALLBACK_API_KEY1 }}
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
          ISSUE_TITLE: ${{ steps.select.outputs.title }}
        run: |
          set -euo pipefail
          SYSTEM='Return only JSON: {"already_resolved":bool,"resolution_rationale":"str","files_to_write":[{"path":"str","content":"str"}],"files_to_delete":["str"]}. Make the smallest safe complete-file changes.'
          jq -n --arg system "$SYSTEM" --rawfile context .ai/context.md --arg model "$OPENAI_MODEL" '{model:$model,messages:[{role:"system",content:$system},{role:"user",content:$context}],temperature:0.15}' > request.json

          HTTP_CODE=$(curl -sS -o response.json -w '%{http_code}' \
            https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @request.json)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::ChatGPT HTTP $HTTP_CODE"
            cat response.json
            exit 1
          fi

          jq -r '.choices[0].message.content // empty' response.json > raw-response.txt

          if [ ! -s raw-response.txt ]; then
            echo "::error::ChatGPT returned no message content."
            cat response.json
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('raw-response.txt').read_text(encoding='utf-8').strip()
          if raw.startswith('```'):
              raw = raw.removeprefix('```json').removeprefix('```').removesuffix('```').strip()
          try:
              parsed = json.loads(raw)
          except Exception as error:
              raise SystemExit(f'ChatGPT returned invalid JSON: {error}\n{raw[:2000]}')
          if not isinstance(parsed, dict):
              raise SystemExit(f'ChatGPT returned {type(parsed).__name__}, expected an object.\n{raw[:2000]}')
          Path('result.json').write_text(json.dumps(parsed), encoding='utf-8')
          PY

      - name: Apply and validate
        env:
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('result.json').read_text(encoding='utf-8'))
          if not isinstance(result, dict):
              raise SystemExit('ChatGPT result is not a JSON object.')
          for path in result.get('files_to_delete') or []:
              path = Path(path)
              if path.is_file():
                  path.unlink()
          for item in result.get('files_to_write') or []:
              path = Path(item['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item['content'], encoding='utf-8')
          Path('rationale.md').write_text(result.get('resolution_rationale', ''), encoding='utf-8')
          PY
          npm test --if-present

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
          ISSUE_TITLE: ${{ steps.select.outputs.title }}
        run: |
          BRANCH="fix/issue-$ISSUE_NUMBER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: resolve issue #$ISSUE_NUMBER"
          git push -u origin "$BRANCH" --force
          { echo "Closes #$ISSUE_NUMBER."; echo; cat rationale.md; } > pr.md
          gh pr create --base main --head "$BRANCH" --title "fix(#$ISSUE_NUMBER): $ISSUE_TITLE" --body-file pr.md

      - name: Mark for human review
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label 'needs-human-review'
