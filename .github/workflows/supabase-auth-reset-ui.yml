name: Supabase Auth Reset UI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/supabase-auth]
  workflow_dispatch:

jobs:
  validate-auth-reset-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify auth reset files
        run: |
          test -f static/auth.html
          test -f static/auth.js
          test -f static/auth.css
          grep -q "PASSWORD_RECOVERY" static/auth.js
          grep -q "updateUser" static/auth.js

      - name: Run focused Supabase Auth validation
        run: |
          npm test -- --runInBand \
            tests/supabase-auth-middleware.test.js \
            tests/web-android-ui-parity.test.js \
            tests/generation-batch.test.js
