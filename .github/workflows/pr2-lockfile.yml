name: "Refresh lockfile for PR #2"
on:
  workflow_dispatch:
  push:
    branches: [fix/pr2-lockfile]
    paths: ['.github/workflows/pr2-lockfile.yml', 'package.json']
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr2-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install
        run: npm ci --no-audit --no-fund
      - name: Validate database tests
        run: node --test tests/migrations.test.js tests/ledger-schema.test.js tests/credits.test.js tests/reservations.test.js tests/settlement.test.js tests/db-integration.test.js
      - name: Commit validated lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git add package-lock.json
          git commit -m 'chore: refresh lockfile for better-sqlite3'
          git push origin HEAD:fix/pr2-lockfile
