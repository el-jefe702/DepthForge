name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy'
        required: false
        default: 'main'

jobs:
  deploy:
    name: Deploy DepthForge
    runs-on: ubuntu-latest
    steps:
      - name: Verify VPS Secrets Configured
        env:
          HAS_HOST: ${{ secrets.VPS_HOST != '' }}
          HAS_USER: ${{ secrets.VPS_USER != '' }}
          HAS_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
        run: |
          echo "VPS_HOST configured: $HAS_HOST"
          echo "VPS_USER configured: $HAS_USER"
          echo "VPS_SSH_KEY configured: $HAS_KEY"
          if [ "$HAS_HOST" != "true" ] || [ "$HAS_USER" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Missing VPS_HOST, VPS_USER, or VPS_SSH_KEY secret in GitHub repository settings."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -ex
            cd /opt/depthforge

            TARGET_REF="${{ github.event.inputs.ref || 'main' }}"
            echo "Deploying ${TARGET_REF}"

            git stash push -m "pre-deploy-$(date +%s)" || true
            git remote set-url origin https://github.com/el-jefe702/DepthForge.git
            git fetch origin "+refs/heads/${TARGET_REF}:refs/remotes/origin/${TARGET_REF}"
            git checkout -B "${TARGET_REF}" "origin/${TARGET_REF}"
            git reset --hard "origin/${TARGET_REF}"

            # Prioritize IPv4 over IPv6 to prevent Google AI Studio datacenter geolocation blocks (code 400 FAILED_PRECONDITION)
            if [ -f /etc/gai.conf ]; then
              grep -q "precedence ::ffff:0:0/96  100" /etc/gai.conf 2>/dev/null || echo "precedence ::ffff:0:0/96  100" >> /etc/gai.conf || true
            fi

            docker compose up -d --build
            docker compose ps
            docker compose logs --tail 50 depthforge || true

            # Remove Nginx HTTP Basic Auth prompts since unified login system is in place
            if [ -f scripts/remove-nginx-basic-auth.sh ]; then
              chmod +x scripts/remove-nginx-basic-auth.sh
              bash scripts/remove-nginx-basic-auth.sh || true
            fi

            # Push latest DepthForge.apk to Google Drive via rclone
            if command -v rclone >/dev/null 2>&1; then
              if curl -fsSL -L "https://github.com/el-jefe702/DepthForge/releases/download/v2.0.0/DepthForge.apk" -o /tmp/DepthForge.apk; then
                rclone copyto /tmp/DepthForge.apk "drive:DepthForge.apk" || true
                rclone copyto /tmp/DepthForge.apk "drive:DepthForge-Backups/DepthForge.apk" || true
                rclone copyto /tmp/DepthForge.apk "gdrive:DepthForge.apk" || true
                rclone copyto /tmp/DepthForge.apk "gdrive:DepthForgeBackups/DepthForge.apk" || true
                rm -f /tmp/DepthForge.apk
                echo "Successfully pushed DepthForge.apk to Google Drive!"
              fi
            fi
