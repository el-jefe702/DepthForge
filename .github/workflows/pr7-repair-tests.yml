name: Repair and validate PR 7 tests
on:
  push:
    branches: [pr4-finished]
    paths: [.github/workflows/pr7-repair-tests.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr4-finished
      - name: Apply guarded test fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('tests/processor_steps.test.js')
          text = p.read_text()
          replacements = {
              'STEP 1: LOAD & CONVERT TO 16-BIT GRAYSCALE': 'STEP 1: LOAD & CONVERT TO FLOAT32 GRAYSCALE',
              'STEP 2: CLEAN UP MISSING DATA (INPAINTING)': 'STEP 2: FILL HOLES (INPAINTING)',
              'STEP 3: SPATIAL FILTERING (FIX BANDING)': 'STEP 3: SPATIAL FILTERING (SMOOTH GRADIENTS)',
          }
          processor = Path('processor.py').read_text()
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              assert new in processor, new
              text = text.replace(old, new, 1)
          p.write_text(text)
          p = Path('tests/cleanup.test.js')
          text = p.read_text()
          anchor = "test('purges files older than TTL and preserves files within TTL threshold', async () => {\n            const now = Date.now();"
          replacement = "test('purges files older than TTL and preserves files within TTL threshold', async () => {\n            const now = Math.floor(Date.now() / 1000) * 1000;"
          assert text.count(anchor) == 1
          p.write_text(text.replace(anchor, replacement, 1))
          p = Path('package.json')
          text = p.read_text()
          old = 'node --test tests/*.test.js'
          new = 'node --test --test-concurrency=1 tests/*.test.js'
          assert json.loads(text)['scripts']['test'] == old
          assert text.count(old) == 1
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- tests/processor_steps.test.js tests/cleanup.test.js package.json
      - name: Commit test fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/processor_steps.test.js tests/cleanup.test.js package.json
          git commit -m 'test: align processor banners, stabilize TTL fixture, serialize shared-file tests'
          git push origin HEAD:refs/heads/pr4-finished
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install numpy opencv-python-headless 'rembg[cpu]'
          echo "PYTHON_EXEC=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          npm ci
      - name: Run repaired full suite
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD | tee tested-commit.txt
          npm test 2>&1 | tee node-tests.log
      - name: Test summary
        if: always()
        run: |
          if [ -f node-tests.log ]; then
            tail -n 30 node-tests.log >> "$GITHUB_STEP_SUMMARY"
            grep -Ein -B 8 -A 35 'not ok|AssertionError|SyntaxError|ModuleNotFoundError' node-tests.log > test-errors.txt || true
            cat test-errors.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr7-repaired-test-results-${{ github.run_id }}
          path: |
            node-tests.log
            test-errors.txt
            tested-commit.txt
          if-no-files-found: warn
          retention-days: 7
