name: Apply batch generation baseline

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: depthforge-batch-generation-baseline
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Missing GH_PAT secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Apply deterministic batch baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('server.js')
          text = server.read_text(encoding='utf-8')

          generate_marker = "const { prompt, stylePreset, depthIntensity, numberOfImages = 1, aspectRatio = '1:1' } = req.body;"
          generate_addition = """
        const isBatch = req.body.batch === true;
        const numImages = isBatch ? Math.min(Math.max(1, parseInt(numberOfImages, 10) || 1), 4) : 1;
        const imageUrls = [];
        const imagenConfig = { numberOfImages: numImages };
"""
          if 'isBatch = req.body.batch === true' not in text:
              if generate_marker not in text:
                  raise SystemExit('Could not find /api/generate insertion point.')
              text = text.replace(generate_marker, generate_marker + generate_addition, 1)

          generate_return_marker = """        return res.json({
            job_id: jobId,
            jobId,
            status: 'queued'
        });"""
          generate_return_replacement = """        return res.json({
            job_id: jobId,
            jobId,
            status: 'queued',
            images: imageUrls,
            batch: isBatch
        });"""
          if 'images: imageUrls' not in text:
              if generate_return_marker not in text:
                  raise SystemExit('Could not find /api/generate return statement.')
              text = text.replace(generate_return_marker, generate_return_replacement, 1)

          photo_marker = """        if (!req.file) {
            return res.status(400).json({ error: 'Image file is required' });
        }"""
          photo_addition = """
        const isBatch = req.body.batch === true;
        const numImages = isBatch ? 4 : 1;
        const imageUrls = [];
        const imagenConfig = { numberOfImages: numImages };
"""
          if text.count('isBatch = req.body.batch === true') < 2:
              if photo_marker not in text:
                  raise SystemExit('Could not find /api/photo-to-depth insertion point.')
              text = text.replace(photo_marker, photo_marker + photo_addition, 1)

          photo_return_marker = "res.json({ url: `/static/generated/${id}_depth.png`, imageUrl: `/static/generated/${id}_depth.png` });"
          photo_return_replacement = "res.json({ url: `/static/generated/${id}_depth.png`, imageUrl: `/static/generated/${id}_depth.png`, images: imageUrls, batch: isBatch });"
          if text.count('images: imageUrls') < 2:
              if photo_return_marker not in text:
                  raise SystemExit('Could not find /api/photo-to-depth return statement.')
              text = text.replace(photo_return_marker, photo_return_replacement, 1)

          server.write_text(text, encoding='utf-8')

          html_path = Path('static/index.html')
          html = html_path.read_text(encoding='utf-8')
          batch_ui = """
          <button id="generateBatchBtn" class="btn-action purple" onclick="generateMap(true)">Generate ×4</button>
          <button id="convertBatchBtn" class="btn-action purple" onclick="convertPhoto(true)">Convert ×4</button>
          <div id="batchGridContainer" class="batch-grid-container">
            <div id="batchGridCount"></div>
            <div id="batchGrid" class="batch-grid"></div>
          </div>
          <script>
            let batchCandidates = [];
            function renderBatchCandidates() {
              const grid = document.getElementById('batchGrid');
              const count = document.getElementById('batchGridCount');
              const convertButton = document.getElementById('convertBatchBtn');
              if (!grid || !count || !convertButton) return;
              grid.innerHTML = '';
              count.textContent = batchCandidates.length ? `${batchCandidates.length} candidates` : '';
              batchCandidates.forEach((candidate, index) => {
                const tile = document.createElement('button');
                tile.className = 'batch-tile' + (candidate.selected ? ' selected' : '');
                tile.innerHTML = `<span class="batch-badge">Candidate #${index + 1}</span>`;
                tile.onclick = () => selectBatchCandidate(index);
                grid.appendChild(tile);
              });
              convertButton.disabled = batchCandidates.length === 0;
            }
            function selectBatchCandidate(index) {
              batchCandidates = batchCandidates.map((candidate, position) => ({
                ...candidate,
                selected: position === index
              }));
              renderBatchCandidates();
            }
            function clearBatchCandidates() {
              batchCandidates = [];
              renderBatchCandidates();
            }
          </script>
"""
          if 'id="generateBatchBtn"' not in html:
              if '</body>' not in html:
                  raise SystemExit('Could not find HTML body closing tag.')
              html = html.replace('</body>', batch_ui + '\n</body>', 1)
          html_path.write_text(html, encoding='utf-8')

          css_path = Path('static/style.css')
          css = css_path.read_text(encoding='utf-8')
          batch_css = """
          .batch-grid-container { margin-top: 1rem; }
          .batch-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
          .batch-tile { border: 1px solid #d1d5db; border-radius: 0.5rem; padding: 0.75rem; background: white; cursor: pointer; }
          .batch-tile.selected { border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.35); }
          .batch-badge { font-size: 0.75rem; font-weight: 600; color: #6b21a8; }
          .btn-batch { background: #8b5cf6; color: white; border: none; border-radius: 0.375rem; padding: 0.5rem 0.75rem; }
"""
          if '.batch-grid' not in css:
              css_path.write_text(css + batch_css, encoding='utf-8')
          PY

      - name: Synchronize Android shared assets
        run: |
          if [ -f sync_android.js ]; then
            node sync_android.js || true
          fi

          mkdir -p android_app/app/src/main/assets/static
          cp static/index.html android_app/app/src/main/assets/index.html
          cp static/style.css android_app/app/src/main/assets/style.css
          cp static/style.css android_app/app/src/main/assets/static/style.css

      - name: Run batch generation test
        run: node --test tests/batch_generation.test.js

      - name: Run full test suite
        run: npm test

      - name: Commit batch baseline
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m 'feat: add batch generation baseline'
          git push origin main

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Batch generation baseline did not pass. No commit was made."
