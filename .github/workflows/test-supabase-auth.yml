name: Test Supabase Auth branch

on:
  push:
    branches:
      - feature/supabase-auth
  pull_request:
    branches:
      - main
      - fix/true-16bit-depth

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test Supabase auth middleware
        run: node --test tests/auth.test.js

      - name: Test generation and UI asset parity
        run: node --test tests/aspect_ratio.test.js

      - name: Test batch generation and UI asset parity
        run: node --test tests/batch_generation.test.js
