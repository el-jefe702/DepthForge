name: Refresh PR lockfile
on:
  push:
    branches: [feature/subscriptions-db]
    paths: ['.github/workflows/refresh-lockfile.yml']
permissions:
  contents: write
  workflows: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subscriptions-db
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Switch database CI to npm ci
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = '.github/workflows/migration-tests.yml';
          const original = fs.readFileSync(file, 'utf8');
          const oldCommand = 'run: npm install --no-audit --no-fund';
          if (!original.includes(oldCommand)) throw new Error('Expected install command not found');
          const updated = original.replace(oldCommand, 'run: npm ci --no-audit --no-fund')
            .replace('Install dependencies (lockfile update still pending)', 'Install locked dependencies');
          fs.writeFileSync(file, updated);
          NODE
      - name: Validate clean install
        run: npm ci --no-audit --no-fund
      - name: Validate database tests
        run: node --test tests/migrations.test.js tests/ledger-schema.test.js tests/credits.test.js tests/reservations.test.js tests/settlement.test.js tests/db-integration.test.js
      - name: Commit validated lockfile and CI update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/migration-tests.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate package lock and use npm ci for DB tests'
          git push origin HEAD:feature/subscriptions-db
