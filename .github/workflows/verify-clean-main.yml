name: Verify cleaned main
on:
  push:
    branches: [pr7-repaired-validation-38319054279]
    paths: [.github/workflows/verify-clean-main.yml]
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-api-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26ad9e7868f5aafd1c6f6f930c3a5daabc703ad2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record tested commit
        run: |
          mkdir -p diagnostics/clean-main
          git rev-parse HEAD > diagnostics/clean-main/tested-commit.txt
      - name: Install dependencies
        run: |
          python -m pip install numpy opencv-python-headless 'rembg[cpu]'
          echo "PYTHON_EXEC=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          npm ci
      - name: Run full suite
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee diagnostics/clean-main/node-tests.log
          code=${PIPESTATUS[0]}
          echo "$code" > diagnostics/clean-main/test-exit-code.txt
          exit "$code"
      - name: Publish readable evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p diagnostics/clean-main
          if [ -f diagnostics/clean-main/node-tests.log ]; then
            tail -n 35 diagnostics/clean-main/node-tests.log > diagnostics/clean-main/summary.txt
            grep -Ein -B 8 -A 35 'not ok|AssertionError|SyntaxError|ModuleNotFoundError' diagnostics/clean-main/node-tests.log > diagnostics/clean-main/errors.txt || true
          else
            echo 'Tests did not execute; inspect dependency setup.' > diagnostics/clean-main/summary.txt
          fi
          cat diagnostics/clean-main/summary.txt >> "$GITHUB_STEP_SUMMARY"
          git switch -c clean-main-validation-${{ github.run_id }}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/clean-main
          git commit -m 'diagnostics: retain test evidence for cleaned main 26ad9e7'
          git push origin HEAD:refs/heads/clean-main-validation-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-main-tests-${{ github.run_id }}
          path: diagnostics/clean-main/
          retention-days: 7
