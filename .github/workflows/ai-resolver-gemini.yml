name: AI resolver — Gemini primary

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number; blank selects the oldest open ai-fix issue'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: depthforge-ai-resolver
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.1-pro-preview
  NEXT_WORKFLOW: ai-resolver-grok.yml

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci || npm install
          python -m pip install --upgrade pip
          python -m pip install google-genai

      - name: Select issue
        id: select
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          ISSUE_NUMBER="${INPUT_ISSUE:-$(gh issue list --state open --label ai-fix --limit 1 --json number --jq '.[0].number // empty')}"
          if [ -z "$ISSUE_NUMBER" ]; then echo "No open ai-fix issues"; exit 1; fi
          gh issue view "$ISSUE_NUMBER" --json title,body > issue.json
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .title issue.json)" >> "$GITHUB_OUTPUT"
          jq -r .body issue.json > issue-body.md

      - name: Build compact context
        env:
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
          ISSUE_TITLE: ${{ steps.select.outputs.title }}
        run: |
          mkdir -p .ai
          {
            echo "Issue #$ISSUE_NUMBER: $ISSUE_TITLE"
            cat issue-body.md
            echo '## Files'
            find . -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './.venv/*' | sort | head -200
            for file in package.json server.js processor.py; do
              [ -f "$file" ] && { echo "## $file"; sed -n '1,500p' "$file"; }
            done
          } > .ai/context.md

      - name: Resolve with Gemini
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
          ISSUE_TITLE: ${{ steps.select.outputs.title }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from google import genai
          from google.genai import types

          issue = os.environ['ISSUE_NUMBER']
          title = os.environ['ISSUE_TITLE']
          context = Path('.ai/context.md').read_text(encoding='utf-8')[:180000]
          system = 'You are a senior engineer. Return only JSON: {"already_resolved":bool,"resolution_rationale":"str","files_to_write":[{"path":"str","content":"str"}],"files_to_delete":["str"]}. Make the smallest safe complete-file changes.'
          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])
          response = client.models.generate_content(
              model=os.environ.get('GEMINI_MODEL', 'gemini-3.1-pro-preview'),
              contents=f'Issue #{issue}: {title}\n\n{context}',
              config=types.GenerateContentConfig(system_instruction=system, response_mime_type='application/json', temperature=0.15),
          )
          Path('result.json').write_text(response.text, encoding='utf-8')
          PY

      - name: Apply and validate
        env:
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('result.json').read_text(encoding='utf-8'))
          for path in result.get('files_to_delete', []):
              p = Path(path)
              if p.is_file(): p.unlink()
          for item in result.get('files_to_write', []):
              p = Path(item['path']); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(item['content'], encoding='utf-8')
          Path('rationale.md').write_text(result.get('resolution_rationale', ''), encoding='utf-8')
          PY
          npm test --if-present

      - name: Create PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
          ISSUE_TITLE: ${{ steps.select.outputs.title }}
        run: |
          BRANCH="fix/issue-$ISSUE_NUMBER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: resolve issue #$ISSUE_NUMBER"
          git push -u origin "$BRANCH" --force
          { echo "Closes #$ISSUE_NUMBER."; echo; cat rationale.md; } > pr.md
          gh pr create --base main --head "$BRANCH" --title "fix(#$ISSUE_NUMBER): $ISSUE_TITLE" --body-file pr.md

      - name: Trigger Grok fallback
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.select.outputs.number }}
        run: |
          gh workflow run "$NEXT_WORKFLOW" --ref main -f issue_number="$ISSUE_NUMBER"
