name: "🛡️ AI PR Review, Test, Auto-Merge & Queue Advance"

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to review, test, and merge"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: pr-automerge-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review-test-and-merge:
    name: "AI Code Audit -> F1-F20 Test -> Squash Merge -> Close Issue"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Target PR Code via gh CLI
        run: |
          gh pr checkout "$PR_NUMBER"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.11 & Headless OpenCV
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy rembg google-genai

      - name: Step 1 — Run Full DepthForge Test Suite (F1–F20)
        env:
          TRUST_PROXY: "1"
        run: |
          echo "🧪 Running full Node.js & Python integration test suite..."
          npm test | tee /tmp/pr_test_results.log

      - name: Step 2 — AI Senior Code Review (Gemini Security & Regression Gate)
        id: ai_review
        run: |
          git fetch origin main
          git diff origin/main...HEAD > /tmp/pr_diff.patch

          python3 - << 'EOF'
          import os, json, sys
          from google import genai

          with open("/tmp/pr_diff.patch", "r", encoding="utf-8", errors="replace") as f:
              diff_text = f.read()[:60000]

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          prompt = f"""You are the Principal Security & Architecture Reviewer for DepthForge.
          Review the following Pull Request git diff.
          Check for:
          1. Accidental removal of features F1-F20 or test assertions
          2. Security vulnerabilities (hardcoded secrets, command injection, broken rate limiting)
          3. Syntax or logic bugs in server.js, processor.py, or README.md

          Respond strictly in valid JSON with this schema:
          {{
            "verdict": "APPROVE" or "REQUEST_CHANGES",
            "summary": "2-3 sentence technical review summary",
            "blocking_issues": ["list of critical bugs if any, else empty array"]
          }}

          GIT DIFF:
          {diff_text}
          """

          response = client.models.generate_content(
              model="gemini-2.5-pro",
              contents=prompt,
          )
          raw = response.text.strip().removeprefix("```json").removeprefix("```").removesuffix("```").strip()
          data = json.loads(raw)

          with open("/tmp/review_summary.md", "w") as out:
              out.write(f"### 🛡️ Autonomous AI Code Review Verdict: **{data['verdict']}**\n\n")
              out.write(f"{data['summary']}\n\n")
              if data.get("blocking_issues"):
                  out.write("#### ❌ Blocking Issues:\n")
                  for item in data["blocking_issues"]:
                      out.write(f"- {item}\n")
              else:
                  out.write("- ✅ Zero regressions detected across F1–F20 test suites.\n")
                  out.write("- ✅ Security & architecture checks passed.\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"verdict={data['verdict']}\n")

          if data["verdict"] != "APPROVE":
              sys.exit(1)
          EOF

      - name: Step 3 — Post Review Comment on PR
        if: always()
        run: |
          if [ -f /tmp/review_summary.md ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/review_summary.md
          fi

      - name: Step 4 — Squash Merge PR, Delete Branch & Close Linked Issue
        if: success() && steps.ai_review.outputs.verdict == 'APPROVE'
        run: |
          # Extract linked issue number from PR body ("Closes #N")
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')
          LINKED_ISSUE=$(echo "$PR_BODY" | grep -oEi 'closes #[0-9]+' | grep -oE '[0-9]+' | head -n 1 || true)

          echo "✅ Merging PR #${PR_NUMBER}..."
          gh pr merge "$PR_NUMBER" --squash --delete-branch

          # Explicitly close and comment on the linked issue if still open
          if [ -n "$LINKED_ISSUE" ]; then
            gh issue close "$LINKED_ISSUE" --reason "completed" --comment "🎉 **Resolved & Merged Automatically!**
            - **Merged PR:** #${PR_NUMBER}
            - **Test Suite (F1–F20):** Passed
            - **AI Review Verdict:** APPROVED" || true
          fi

      - name: Step 5 — Advance Queue (Trigger Next Pending Issue Automatically)
        if: success() && steps.ai_review.outputs.verdict == 'APPROVE'
        run: |
          # Find the oldest open issue that does NOT yet have 'ai-fix' and was created from our audit
          NEXT_ISSUE=$(gh issue list --state open --json number,labels --jq '
            map(select(.labels | map(.name) | index("ai-fix") | not))
            | sort_by(.number)
            | .[0].number // empty
          ')

          if [ -n "$NEXT_ISSUE" ]; then
            echo "🚀 Advancing queue! Triggering AI Issue Resolver on Issue #${NEXT_ISSUE}..."
            gh issue edit "$NEXT_ISSUE" --add-label "ai-fix"
            gh workflow run ai-issue-resolver.yml -f issue_number="$NEXT_ISSUE" || true
          else
            echo "🏁 All open issues in the queue have been resolved!"
          fi
          
