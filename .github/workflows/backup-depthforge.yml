name: Backup DepthForge VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Create, retain, and upload VPS backup
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p 22 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
              set -euo pipefail
              backup_dir=/root/backups/depthforge
              drive_remote=drive:DepthForge-Backups
              timestamp=$(date -u +%Y%m%dT%H%M%SZ)
              staging_dir=$(mktemp -d)
              archive="$backup_dir/depthforge_$timestamp.tar.gz"
              cleanup() { rm -rf "$staging_dir"; }
              trap cleanup EXIT

              mkdir -p "$backup_dir" "$staging_dir/config" "$staging_dir/volumes"

              if [ -f /opt/depthforge/.env ]; then
                install -m 600 /opt/depthforge/.env "$staging_dir/config/depthforge.env"
              fi
              if [ -f /etc/nginx/sites-available/depthforge.conf ]; then
                install -m 600 /etc/nginx/sites-available/depthforge.conf "$staging_dir/config/depthforge.conf"
              fi
              cp -a /etc/letsencrypt "$staging_dir/config/letsencrypt"

              docker run --rm \
                -v depthforge_app_data:/source:ro \
                -v "$staging_dir/volumes":/backup \
                alpine:3.20 sh -c "cd /source && tar czf /backup/app_data.tar.gz ."
              docker run --rm \
                -v depthforge_generated_data:/source:ro \
                -v "$staging_dir/volumes":/backup \
                alpine:3.20 sh -c "cd /source && tar czf /backup/generated_data.tar.gz ."

              tar -C "$staging_dir" -czf "$archive" .
              chmod 600 "$archive"

              find "$backup_dir" -maxdepth 1 -type f -name "depthforge_*.tar.gz" -printf "%T@ %p\n" \
                | sort -nr | awk "NR > 14 {print \$2}" | xargs -r rm -f

              rclone copy "$backup_dir" "$drive_remote" --transfers 4 --checkers 8

              # Also push latest DepthForge.apk to Google Drive
              if curl -fsSL -L "https://github.com/el-jefe702/DepthForge/releases/download/v2.0.0/DepthForge.apk" -o /tmp/DepthForge.apk; then
                rclone copyto /tmp/DepthForge.apk "drive:DepthForge.apk" || true
                rclone copyto /tmp/DepthForge.apk "$drive_remote/DepthForge.apk" || true
                rm -f /tmp/DepthForge.apk
                echo "Uploaded DepthForge.apk to Google Drive!"
              fi

              echo "Backup created and uploaded: $(basename "$archive")"
              du -h "$archive" | cut -f1
            '
