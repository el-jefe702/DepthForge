name: Autonomous Self-Evolving AI Issue Resolver & PR Reviewer v2

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific Issue Number to resolve'
        required: false
        type: string
      pr_number:
        description: 'Specific PR Number to audit'
        required: false
        type: string

concurrency:
  group: ai-issue-resolver-v2-singleton
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

env:
  TRUST_PROXY: "1"
  NODE_ENV: "test"
  GEMINI_MODEL: "gemini-3.1-pro-preview"
  MAX_HEAL_ATTEMPTS: "3"
  LEDGER_PATH: ".ai-memory/evolution_ledger.json"

jobs:
  resolve-review-evolve:
    name: Resolve, Review PR, Assess Win & Evolve
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq libgl1 libglib2.0-0
          npm ci || npm install
          python -m pip install --upgrade pip
          python -m pip install opencv-python-headless numpy trimesh google-genai requests
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Configure Git Identity
        run: |
          git config --global user.name "SpatialOps Autonomous Architect"
          git config --global user.email "actions@spatialops.llc"

      - name: Select Target Issue or PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ github.event.inputs.issue_number }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          TARGET_ISSUE=""
          TARGET_PR=""

          if [ -n "$INPUT_PR" ]; then
            TARGET_PR="$INPUT_PR"
          elif [ "$EVENT_NAME" = "pull_request_target" ] && [ -n "$EVENT_PR" ]; then
            TARGET_PR="$EVENT_PR"
          fi

          if [ -n "$INPUT_ISSUE" ]; then
            TARGET_ISSUE="$INPUT_ISSUE"
          elif [ "$EVENT_NAME" = "issues" ] && [ -n "$EVENT_ISSUE" ]; then
            TARGET_ISSUE="$EVENT_ISSUE"
          elif [ -z "$TARGET_PR" ]; then
            TARGET_ISSUE=$(gh issue list --state open --limit 30 --json number,labels \
              --jq '[.[] | select(([.labels[].name] | inside(["needs-human-review", "wontfix", "in-progress"]) | not))] | sort_by(.number) | .[0].number // empty')
          fi

          echo "issue_number=$TARGET_ISSUE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$TARGET_PR" >> "$GITHUB_OUTPUT"

      - name: Execute Self-Evolving AI Solver
        if: steps.target.outputs.issue_number != '' || steps.target.outputs.pr_number != ''
        id: agent
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FALLBACK_API_KEY: ${{ secrets.FALLBACK_API_KEY }}
          FALLBACK_API_KEY1: ${{ secrets.FALLBACK_API_KEY1 }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          cat << 'PYEOF' > /tmp/autonomous_evolver_v2.py
          import json, os, subprocess, sys, urllib.error, urllib.request, re
          from datetime import datetime, timezone
          from pathlib import Path
          from google import genai
          from google.genai import types

          REPO = os.environ.get("REPO", "")
          ISSUE_NUMBER = os.environ.get("ISSUE_NUMBER", "").strip()
          PR_NUMBER = os.environ.get("PR_NUMBER", "").strip()
          PRIMARY_KEY = os.environ.get("GEMINI_API_KEY", "").strip()
          FB_KEY = os.environ.get("FALLBACK_API_KEY", "").strip()
          FB_KEY1 = os.environ.get("FALLBACK_API_KEY1", "").strip()
          MODEL_NAME = os.environ.get("GEMINI_MODEL", "gemini-3.1-pro-preview")
          MAX_ATTEMPTS = int(os.environ.get("MAX_HEAL_ATTEMPTS", "3"))

          def clean_json_response(raw_text):
              try:
                  return json.loads(raw_text)
              except Exception:
                  match = re.search(r'```(?:json)?\s*(\{.*?\})\s*```', raw_text, re.DOTALL)
                  if match:
                      return json.loads(match.group(1))
                  match_brace = re.search(r'\{.*\}', raw_text, re.DOTALL)
                  if match_brace:
                      return json.loads(match_brace.group(0))
                  raise

          def call_openai_compatible(name, key, base_url, model, sys_inst, prompt):
              payload = json.dumps({
                  "model": model,
                  "messages": [
                      {"role": "system", "content": sys_inst + "\n\nCRITICAL: Return strictly valid JSON only inside a ```json markdown block."},
                      {"role": "user", "content": prompt}
                  ],
                  "temperature": 0.15
              }).encode("utf-8")

              req = urllib.request.Request(
                  f"{base_url}/chat/completions",
                  data=payload,
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req) as response:
                      res_data = json.loads(response.read().decode("utf-8"))
                      return clean_json_response(res_data["choices"][0]["message"]["content"])
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="ignore")
                  raise RuntimeError(f"{name} HTTP {e.code}: {body}") from e

          def call_llm(sys_inst, prompt):
              tiers = [
                  ("Primary Gemini", PRIMARY_KEY, None, MODEL_NAME, "gemini"),
                  ("Grok Fallback", FB_KEY, "https://api.x.ai/v1", "grok-4", "openai"),
                  ("ChatGPT Fallback", FB_KEY1, "https://api.openai.com/v1", "gpt-4o", "openai")
              ]

              active_tiers = [tier for tier in tiers if tier[1]]
              if not active_tiers:
                  raise RuntimeError("No API keys provided in environment secrets.")

              last_err = None
              for name, key, base_url, model, provider_type in active_tiers:
                  try:
                      print(f"Attempting LLM call with {name} using model {model}...")
                      if provider_type == "gemini":
                          client = genai.Client(api_key=key)
                          response = client.models.generate_content(
                              model=model,
                              contents=prompt,
                              config=types.GenerateContentConfig(
                                  system_instruction=sys_inst,
                                  response_mime_type="application/json",
                                  temperature=0.15
                              )
                          )
                          return clean_json_response(response.text)

                      return call_openai_compatible(name, key, base_url, model, sys_inst, prompt)
                  except Exception as e:
                      print(f"⚠️ {name} failed: {e}")
                      last_err = e
                      continue

              raise RuntimeError(f"All available LLM tiers exhausted. Last error: {last_err}")

          def sh(cmd, check=False, capture=True):
              print(f"$ {cmd}")
              result = subprocess.run(cmd, shell=True, text=True, stdout=subprocess.PIPE if capture else None, stderr=subprocess.STDOUT if capture else None)
              output = (result.stdout or "").strip()
              if output:
                  print(output)
              if check and result.returncode != 0:
                  raise RuntimeError(f"Command failed ({result.returncode}): {cmd}\n{output}")
              return result.returncode, output

          def get_repo_snapshot():
              _, tree = sh("git ls-files | grep -vE '^(node_modules|dist|build|\\.git)/' | head -n 160")
              key_files = ["package.json", "server.js", "processor.py", "README.md"]
              snippets = {f: Path(f).read_text(encoding="utf-8")[:12000] for f in key_files if Path(f).is_file()}
              return tree, snippets

          def run_validation_suite():
              logs = []
              sh("python -m pip install opencv-python-headless numpy trimesh requests || true")
              package = Path("package.json")
              if package.exists():
                  rc, output = sh("npm install --no-audit --no-fund")
                  logs.append(f"=== npm install ===\n{output}")
                  if rc != 0:
                      return False, "\n".join(logs)

                  package_data = json.loads(package.read_text(encoding="utf-8"))
                  if "test" in package_data.get("scripts", {}):
                      rc, output = sh("TRUST_PROXY=1 npm test")
                      logs.append(f"=== npm test ===\n{output}")
                      if rc != 0:
                          return False, "\n".join(logs)

              return True, "\n".join(logs) if logs else "Tests passed."

          issue_data = {}
          if ISSUE_NUMBER:
              rc, output = sh(f"gh issue view {ISSUE_NUMBER} --repo '{REPO}' --json number,title,body")
              if rc == 0:
                  issue_data = json.loads(output)

          if ISSUE_NUMBER and not PR_NUMBER:
              _, existing_pr = sh(f"gh pr list --repo '{REPO}' --state open --json number,headRefName --jq '[.[] | select(.headRefName == \"fix/issue-{ISSUE_NUMBER}\")] | .[0].number // empty'")
              if existing_pr:
                  PR_NUMBER = existing_pr.strip()

          branch_name = f"fix/issue-{ISSUE_NUMBER}" if ISSUE_NUMBER else f"audit/pr-{PR_NUMBER}"
          sh(f"git checkout -B '{branch_name}' origin/main", check=True)

          tree, snippets = get_repo_snapshot()
          issue_body = issue_data.get("body") or ""
          issue_title = issue_data.get("title") or ""

          solver_system = """You are the DepthForge Code Architect. Output JSON only. Return: {"already_resolved": bool, "resolution_rationale": "str", "files_to_write": [{"path": "str", "content": "str"}], "files_to_delete": ["str"]}"""

          test_passed = False
          last_log = ""
          solver_output = {}

          for attempt in range(1, MAX_ATTEMPTS + 1):
              print(f"=== Attempt {attempt} ===")
              prompt = f"ISSUE: {issue_title}\n{issue_body}\nTREE:\n{tree}\nFILES:\n{json.dumps(snippets)}\nPREVIOUS LOGS:\n{last_log}"
              solver_output = call_llm(solver_system, prompt)

              for file_path in solver_output.get("files_to_delete", []):
                  path = Path(file_path)
                  if path.is_file():
                      path.unlink()

              for file_object in solver_output.get("files_to_write", []):
                  path = Path(file_object["path"])
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(file_object["content"], encoding="utf-8")
                  snippets[file_object["path"]] = file_object["content"][:15000]

              test_passed, last_log = run_validation_suite()
              if test_passed:
                  break
              print("Failed. Healing...")

          _, status = sh("git status --porcelain")
          has_changes = bool(status.strip())

          if has_changes and test_passed:
              sh("git add -A", check=True)
              sh(f"git commit -m \"fix: resolve #{ISSUE_NUMBER or PR_NUMBER}\"", check=True)
              sh(f"git push -u origin '{branch_name}' --force", check=True)

              if not PR_NUMBER:
                  Path("/tmp/pr.md").write_text(f"Closes #{ISSUE_NUMBER}\n{solver_output.get('resolution_rationale', '')}", encoding="utf-8")
                  sh(f"gh pr create --repo '{REPO}' --base main --head '{branch_name}' --title \"fix(#{ISSUE_NUMBER}): {issue_title[:65]}\" --body-file /tmp/pr.md")
                  _, PR_NUMBER = sh(f"gh pr view '{branch_name}' --repo '{REPO}' --json number --jq '.number'")
                  PR_NUMBER = PR_NUMBER.strip()

          review_system = """You are the PR Assessor. Output strict JSON: {"verdict": "WIN_MERGE" | "ALREADY_RESOLVED_CLOSE" | "NEEDS_HUMAN", "closeout_notes_markdown": "str"}"""
          review_prompt = f"ISSUE: {issue_body}\nCHANGES: {has_changes}\nTEST_PASSED: {test_passed}\nLOG: {last_log[-2000:]}"
          review_output = call_llm(review_system, review_prompt)

          verdict = review_output.get("verdict", "NEEDS_HUMAN") if test_passed else "NEEDS_HUMAN"
          if not has_changes and solver_output.get("already_resolved") and test_passed:
              verdict = "ALREADY_RESOLVED_CLOSE"

          Path("/tmp/review.md").write_text(f"## Verdict: {verdict}\nTests: {'PASSED' if test_passed else 'FAILED'}\n{review_output.get('closeout_notes_markdown', '')}", encoding="utf-8")

          if PR_NUMBER:
              sh(f"gh pr review {PR_NUMBER} --repo '{REPO}' --comment --body-file /tmp/review.md")
              if verdict == "WIN_MERGE":
                  sh(f"gh pr merge {PR_NUMBER} --repo '{REPO}' --squash --delete-branch")

          if ISSUE_NUMBER:
              if verdict in ("WIN_MERGE", "ALREADY_RESOLVED_CLOSE"):
                  sh(f"gh issue close {ISSUE_NUMBER} --repo '{REPO}' --reason completed")
              else:
                  sh(f"gh issue edit {ISSUE_NUMBER} --repo '{REPO}' --add-label 'needs-human-review'")

          sh("git checkout main && git reset --hard origin/main || true")
          PYEOF
          python3 /tmp/autonomous_evolver_v2.py

      - name: Advance Queue
        if: always() && steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          NEXT_ISSUE=$(gh issue list --repo "$REPO" --state open --limit 30 --json number,labels --jq '[.[] | select(([.labels[].name] | inside(["needs-human-review", "wontfix", "in-progress"]) | not))] | sort_by(.number) | .[0].number // empty')
          if [ -n "$NEXT_ISSUE" ]; then
            gh workflow run ai-issue-resolver-v2.yml --repo "$REPO" -f issue_number="$NEXT_ISSUE" || true
          fi
