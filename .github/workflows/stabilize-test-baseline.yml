name: Stabilize test baseline

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: depthforge-stabilize-test-baseline
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Create deterministic test environment
        run: |
          mkdir -p scripts
          cat > scripts/prepare-test-env.mjs <<'EOF'
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { fileURLToPath } from 'node:url';

          const rootDir = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');

          process.env.NODE_ENV = 'test';
          process.env.TRUST_PROXY = '1';
          process.env.PORT = process.env.PORT || '3001';
          process.env.JWT_SECRET = process.env.JWT_SECRET || 'depthforge-deterministic-test-secret-32b';
          process.env.DB_PATH = path.join(rootDir, 'test-database.sqlite');

          function createTestToken() {
            const header = Buffer.from(JSON.stringify({ alg: 'HS256', typ: 'JWT' })).toString('base64url');
            const payload = Buffer.from(JSON.stringify({
              id: 'test_user',
              userId: 'test_user',
              user_id: 'test_user',
              role: 'admin',
              exp: Math.floor(Date.now() / 1000) + 86400
            })).toString('base64url');
            const signature = crypto
              .createHmac('sha256', process.env.JWT_SECRET)
              .update(`${header}.${payload}`)
              .digest('base64url');
            return `${header}.${payload}.${signature}`;
          }

          const token = createTestToken();
          process.env.TEST_JWT_TOKEN = token;
          process.env.AUTH_TOKEN = `Bearer ${token}`;

          if (!globalThis.window) globalThis.window = globalThis;

          if (!globalThis.document) {
            const canvas = () => ({
              width: 800,
              height: 600,
              style: {},
              addEventListener: () => {},
              removeEventListener: () => {},
              getContext(type) {
                if (/webgl/i.test(type)) {
                  const noop = () => {};
                  return {
                    getExtension: () => null,
                    getParameter: () => 2048,
                    createTexture: () => ({}),
                    bindTexture: noop,
                    texParameteri: noop,
                    texImage2D: noop,
                    clearColor: noop,
                    clear: noop,
                    enable: noop,
                    disable: noop,
                    viewport: noop,
                    drawArrays: noop,
                    drawElements: noop,
                    createBuffer: () => ({}),
                    bindBuffer: noop,
                    bufferData: noop,
                    createProgram: () => ({}),
                    createShader: () => ({}),
                    shaderSource: noop,
                    compileShader: noop,
                    attachShader: noop,
                    linkProgram: noop,
                    useProgram: noop
                  };
                }
                return {
                  fillRect: () => {},
                  clearRect: () => {},
                  getImageData: () => ({ data: new Uint8ClampedArray(4) }),
                  putImageData: () => {},
                  createImageData: () => ({ data: new Uint8ClampedArray(4) }),
                  setTransform: () => {},
                  drawImage: () => {}
                };
              }
            });

            globalThis.document = {
              createElement(tag) {
                return tag === 'canvas' ? canvas() : { style: {}, appendChild: () => {}, addEventListener: () => {} };
              },
              getElementById: () => null,
              body: { appendChild: () => {} }
            };
          }

          if (!globalThis.requestAnimationFrame) {
            globalThis.requestAnimationFrame = callback => setTimeout(() => callback(Date.now()), 16);
            globalThis.cancelAnimationFrame = id => clearTimeout(id);
          }

          console.log('Test environment initialized: deterministic JWT fixtures and headless DOM/WebGL mocks.');
          EOF

          cat > tests/auth-helper.js <<'EOF'
          export function getAuthHeaders(extraHeaders = {}) {
            const token = process.env.TEST_JWT_TOKEN;
            if (!token) {
              throw new Error('TEST_JWT_TOKEN is missing; run scripts/prepare-test-env.mjs before tests.');
            }
            return { Authorization: `Bearer ${token}`, ...extraHeaders };
          }

          export const token = process.env.TEST_JWT_TOKEN;
          EOF

      - name: Remove mutating patch scripts
        run: |
          rm -f patch.js patch_issue32.js patch_issue33.js patch_issue39.js

      - name: Replace mutating package hooks
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          package = json.loads(path.read_text(encoding='utf-8'))
          scripts = package.setdefault('scripts', {})
          scripts.pop('prestart', None)
          scripts.pop('predev', None)
          scripts['pretest'] = 'node scripts/prepare-test-env.mjs'
          scripts['test'] = 'node --import ./scripts/prepare-test-env.mjs --test tests/*.test.js'
          scripts['test:unit'] = 'node --import ./scripts/prepare-test-env.mjs --test tests/*.test.js'
          path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run full test suite
        run: npm test

      - name: Create stabilization PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH='stabilize-test-baseline'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::No stabilization changes were produced."
            exit 1
          fi

          git commit -m 'test: replace mutating patches with deterministic test environment'
          git push -u origin "$BRANCH" --force

          cat > pr.md <<'EOF'
          ## Stabilize test baseline

          - Removes source/test mutation from `prestart`, `predev`, and `pretest`.
          - Deletes `patch.js`, `patch_issue32.js`, `patch_issue33.js`, and `patch_issue39.js`.
          - Adds a deterministic JWT test fixture and centralized auth-header helper.
          - Adds headless DOM/WebGL mocks for Three.js preview tests.
          - Preserves all existing dependencies and non-patch scripts.

          The workflow created this PR only after the complete test suite passed.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'test: stabilize baseline and remove mutating patches' \
            --body-file pr.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '### Test baseline stabilization failed' > failure.md
          echo 'The replacement test setup did not pass the full suite. Review the workflow logs before merging or rerunning AI resolvers.' >> failure.md
          gh issue list --state open --limit 1 --json number --jq '.[0].number' > issue-number.txt || true
          if [ -s issue-number.txt ]; then
            issue=$(cat issue-number.txt)
            gh issue comment "$issue" --body-file failure.md
            gh issue edit "$issue" --add-label 'needs-human-review'
          fi
