name: Fix batch generation tests

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: depthforge-batch-generation-repair
  cancel-in-progress: false

env:
  OPENAI_MODEL: gpt-4o
  TEST_FILE: tests/batch_generation.test.js
  GH_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Missing GH_PAT secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Reproduce batch generation failure
        continue-on-error: true
        run: |
          set +e
          node --test "$TEST_FILE" > failing-tests.log 2>&1
          cat failing-tests.log
          exit 0

      - name: Repair server batch API
        env:
          OPENAI_API_KEY: ${{ secrets.FALLBACK_API_KEY1 }}
        run: |
          set -euo pipefail
          mkdir -p .ai
          cat > .ai/server-context.md <<'EOF'
          Repair only server.js.

          Implement batch generation for POST /api/generate and POST /api/photo-to-depth.

          IMPORTANT: The tests use exact substring matching. Both endpoints must contain these exact code fragments:

          isBatch = req.body.batch === true
          numberOfImages: numImages
          images: imageUrls
          batch: isBatch

          Do not rename these variables. Do not use optional chaining for the batch check. Do not reformat these exact fragments.

          Return the complete updated server.js. Do not modify tests.

          ## Failing tests
          EOF
          cat failing-tests.log >> .ai/server-context.md
          echo '\n## Test expectations' >> .ai/server-context.md
          cat "$TEST_FILE" >> .ai/server-context.md
          echo '\n## Current server.js' >> .ai/server-context.md
          cat server.js >> .ai/server-context.md

          for attempt in 1 2; do
            echo "=== Server repair attempt $attempt ==="

            jq -n \
              --arg system 'Return only a JSON object: {"analysis":"string","files_to_write":[{"path":"string","content":"string"}]}. The only allowed path is server.js. Return its complete contents. Include the four exact required code fragments verbatim in both batch-capable endpoints.' \
              --rawfile context .ai/server-context.md \
              --arg model "$OPENAI_MODEL" \
              '{model:$model,response_format:{type:"json_object"},max_completion_tokens:16000,messages:[{role:"system",content:$system},{role:"user",content:$context}],temperature:0.1}' \
              > request.json

            http_code=$(curl -sS -o response.json -w '%{http_code}' \
              https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H 'Content-Type: application/json' \
              --data @request.json)

            echo "OpenAI HTTP $http_code"
            jq '{finish_reason: .choices[0].finish_reason, usage: .usage}' response.json || true

            if [ "$http_code" != "200" ]; then
              cat response.json
              exit 1
            fi

            jq -r '.choices[0].message.content' response.json > raw-response.json

            if python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('raw-response.json').read_text(encoding='utf-8'))
          files = plan.get('files_to_write') or []
          if not files or files[0].get('path') != 'server.js':
              raise SystemExit('OpenAI did not return server.js.')
          content = files[0]['content']
          required = [
              'isBatch = req.body.batch === true',
              'numberOfImages: numImages',
              'images: imageUrls',
              'batch: isBatch'
          ]
          missing = [text for text in required if text not in content]
          if missing:
              print('MISSING_ASSERTIONS=' + '\n'.join(missing))
              raise SystemExit(2)
          Path('server.js').write_text(content, encoding='utf-8')
          PY
            then
              echo 'Server repair validation passed.'
              break
            fi

            if [ "$attempt" = "2" ]; then
              echo "::error::ChatGPT failed to include the exact required batch assertions after retry."
              exit 1
            fi

            python3 - <<'PY'
          from pathlib import Path
          context = Path('.ai/server-context.md').read_text(encoding='utf-8')
          response = Path('raw-response.json').read_text(encoding='utf-8')
          Path('.ai/server-context.md').write_text(
              context + '\n\n## PRIOR INVALID RESPONSE EXCERPT\n' + response[:4000] +
              '\n\nYour previous response omitted or changed required exact assertions. Return server.js again with all four exact fragments verbatim in both endpoints.',
              encoding='utf-8'
          )
          PY
          done

      - name: Repair web batch UI
        env:
          OPENAI_API_KEY: ${{ secrets.FALLBACK_API_KEY1 }}
        run: |
          set -euo pipefail
          {
            echo 'Repair only static/index.html and static/style.css.'
            echo 'Implement the web Batch Generation UI and CSS exactly as required by the failing tests.'
            echo 'Return complete updated contents for both files. Do not modify tests or server.js.'
            echo
            echo '## Failing tests'
            cat failing-tests.log
            echo
            echo '## Test expectations'
            cat "$TEST_FILE"
            echo
            echo '## Current index.html'
            cat static/index.html
            echo
            echo '## Current style.css'
            cat static/style.css
          } > .ai/web-context.md

          jq -n \
            --arg system 'Return only a JSON object: {"analysis":"string","files_to_write":[{"path":"string","content":"string"}]}. Allowed paths are static/index.html and static/style.css. Return complete contents for every changed file.' \
            --rawfile context .ai/web-context.md \
            --arg model "$OPENAI_MODEL" \
            '{model:$model,response_format:{type:"json_object"},max_completion_tokens:16000,messages:[{role:"system",content:$system},{role:"user",content:$context}],temperature:0.1}' \
            > request.json

          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            --data @request.json)

          if [ "$http_code" != "200" ]; then
            echo "::error::OpenAI HTTP $http_code"
            cat response.json
            exit 1
          fi

          jq -r '.choices[0].message.content' response.json > raw-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('raw-response.json').read_text(encoding='utf-8'))
          allowed = {'static/index.html', 'static/style.css'}
          files = plan.get('files_to_write') or []
          if not files:
              raise SystemExit('OpenAI returned no web files.')
          for item in files:
              if item.get('path') not in allowed:
                  raise SystemExit(f"Refusing to modify disallowed path: {item['path']}")
              Path(item['path']).write_text(item['content'], encoding='utf-8')
          PY

      - name: Synchronize Android shared assets
        run: |
          if [ -f sync_android.js ]; then
            node sync_android.js || true
          fi

          mkdir -p android_app/app/src/main/assets/static
          cp static/index.html android_app/app/src/main/assets/index.html
          cp static/style.css android_app/app/src/main/assets/style.css
          cp static/style.css android_app/app/src/main/assets/static/style.css

      - name: Run batch generation test
        run: node --test "$TEST_FILE"

      - name: Run full test suite
        run: npm test

      - name: Create repair PR
        if: success()
        run: |
          BRANCH='fix/batch-generation-tests'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::No repair changes were produced."
            exit 1
          fi

          git commit -m 'feat: implement batch generation for web and API'
          git push -u origin "$BRANCH" --force

          cat > pr.md <<'EOF'
          ## Batch Generation repair

          Implements the batch generation API and web UI behavior required by `tests/batch_generation.test.js`, then synchronizes Android shared assets.

          Created only after the targeted test and full test suite passed.
          EOF

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title 'feat: implement batch generation' \
            --body-file pr.md

      - name: Report unresolved failure
        if: failure()
        run: |
          {
            echo '### Batch Generation repair failed'
            echo
            echo '```text'
            tail -n 200 failing-tests.log 2>/dev/null || true
            echo '```'
          } > failure.md

          issue=$(gh issue list --state open --search 'Batch Generation in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file failure.md
            gh issue edit "$issue" --add-label 'needs-human-review'
          fi
