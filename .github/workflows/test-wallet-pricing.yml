name: Test wallet creation and pricing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]==3.2.3'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test lifecycle, wallet creation, and pricing
        env:
          TEST_DB_URL: postgresql://postgres:local_test_only@localhost:5432/wallet_test
        run: python tests/wallet_pricing.py
