name: Test backend credit adapter
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check adapter syntax
        run: node --check credit-backend.js
      - name: Run mocked credit adapter tests
        run: node --test tests/credit-backend.test.js
