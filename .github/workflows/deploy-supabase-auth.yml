name: Deploy Supabase Auth (safe)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy DepthForge with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p 22 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            cd /opt/depthforge
            git pull --ff-only
            docker compose up -d --build
            docker compose ps
          '

      - name: Verify public health endpoint
        env:
          BASIC_AUTH_USER: ${{ secrets.DEPTHFORGE_BASIC_AUTH_USER }}
          BASIC_AUTH_PASSWORD: ${{ secrets.DEPTHFORGE_BASIC_AUTH_PASSWORD }}
        run: |
          auth="$(printf '%s:%s' "$BASIC_AUTH_USER" "$BASIC_AUTH_PASSWORD" | base64 -w 0)"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: Basic $auth" \
              https://depthforge.spatialops.llc/api/health; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "DepthForge health endpoint did not become ready." >&2
          exit 1
