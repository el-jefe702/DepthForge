name: Migration tests
on:
  push:
    branches: [feature/subscriptions-db]
  pull_request:
    paths:
      - 'db/**'
      - 'tests/migrations.test.js'
      - 'package*.json'
      - '.github/workflows/migration-tests.yml'
permissions:
  contents: read
jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (lockfile update still pending)
        run: npm install --no-audit --no-fund
      - name: Run migration suite
        run: node --test tests/migrations.test.js
